apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tauri-release-build
  namespace: pipelines-as-code
spec:
  params:
    - name: app-path
      type: string
      description: Relative path from the source workspace to the Tauri application
    - name: artifact-prefix
      type: string
      default: kuri
      description: Lower-case portable slug used as the release asset filename prefix
    - name: version
      type: string
      description: SemVer version without a leading v
    - name: android-version-code
      type: string
      description: Positive Android versionCode
    - name: builder-image
      type: string
      description: Immutable or version-pinned tauri-release-ci image reference
    - name: expected-signing-cert-sha256
      type: string
      description: Expected APK signer certificate SHA-256 fingerprint
    - name: openbao-role
      type: string
      description: OpenBao Kubernetes auth role and projected token audience
    - name: openbao-policy
      type: string
      description: Exact policy expected on the issued OpenBao token
    - name: openbao-signing-secret-path
      type: string
      description: KV v2 API path below /v1, including the mount and data segments
  workspaces:
    - name: source
    - name: output
  volumes:
    - name: openbao-ci-jwt
      projected:
        sources:
          - serviceAccountToken:
              path: token
              audience: $(params.openbao-role)
              expirationSeconds: 600
    - name: openbao-ci-session
      emptyDir:
        medium: Memory
        sizeLimit: 2Mi
  steps:
    - name: openbao-login
      ref:
        name: openbao-kubernetes-login
      params:
        - name: role
          value: $(params.openbao-role)
        - name: expected-policy
          value: $(params.openbao-policy)
        - name: max-lease-seconds
          value: "900"
    - name: build-and-sign
      image: $(params.builder-image)
      imagePullPolicy: Always
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsUser: 0
      env:
        - name: APP_PATH
          value: $(params.app-path)
        - name: ARTIFACT_PREFIX
          value: $(params.artifact-prefix)
        - name: VERSION
          value: $(params.version)
        - name: ANDROID_VERSION_CODE
          value: $(params.android-version-code)
        - name: EXPECTED_CERT_SHA256
          value: $(params.expected-signing-cert-sha256)
        - name: OPENBAO_SECRET_PATH
          value: $(params.openbao-signing-secret-path)
        - name: SOURCE_ROOT
          value: $(workspaces.source.path)
        - name: OUTPUT_ROOT
          value: $(workspaces.output.path)
      volumeMounts:
        - name: openbao-ci-session
          mountPath: /var/run/secrets/openbao-ci/session
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        export LC_ALL=C
        umask 077
        unset http_proxy https_proxy all_proxy no_proxy HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY

        session_dir=/var/run/secrets/openbao-ci/session
        token_file=${session_dir}/token
        response_file=${session_dir}/signing-response.json
        keystore_file=${session_dir}/release.keystore
        config_file=${session_dir}/tauri-release-config.json
        verify_file=${session_dir}/apk-verify.txt
        aligned_apk=${OUTPUT_ROOT}/.aligned.apk
        signed_apk=${OUTPUT_ROOT}/.signed.apk
        signed_apk_idsig=${signed_apk}.idsig

        cleanup() {
          rm -f -- "$response_file" "$keystore_file" "$config_file" "$verify_file" "$aligned_apk" "$signed_apk" "$signed_apk_idsig"
          unset ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD
        }
        trap cleanup EXIT
        trap 'exit 1' HUP INT TERM

        fail() {
          printf '%s\n' "$1" >&2
          exit 1
        }

        validate_relative_path() {
          local value=$1 label=$2 part
          [[ -n "$value" && ${#value} -le 512 ]] || fail "$label is empty or too long"
          [[ "$value" != /* && "$value" != *\\* ]] || fail "$label must be a portable relative path"
          IFS=/ read -ra parts <<< "$value"
          for part in "${parts[@]}"; do
            [[ -n "$part" && "$part" != . && "$part" != .. ]] || fail "$label contains an unsafe path segment"
          done
        }

        verify_appimage_links() (
          local image=$1 inspection_dir appdir desktop exec_line executable main_elf library_path asound_path provider tool
          for tool in timeout readelf ldd realpath; do
            command -v "$tool" >/dev/null || fail "AppImage link inspection requires $tool"
          done
          inspection_dir=$(mktemp -d) || fail 'AppImage inspection directory could not be created'
          trap 'rm -rf -- "$inspection_dir"' EXIT
          trap 'exit 1' HUP INT TERM
          inspection_dir=$(realpath -e "$inspection_dir") || fail 'AppImage inspection directory could not be resolved'
          cd "$inspection_dir"
          timeout --kill-after=5s 120s env -i PATH="$PATH" HOME="$inspection_dir" LC_ALL=C \
            "$image" --appimage-extract >/dev/null 2>&1 || fail 'AppImage extraction failed (120 second limit; no FUSE required)'
          appdir=$(realpath -e "$inspection_dir/squashfs-root") || fail 'AppImage extraction did not produce an AppDir'
          [[ "$appdir" == "$inspection_dir/squashfs-root" && -d "$appdir" ]] || fail 'AppImage extraction root is unsafe'
          local -a desktops
          mapfile -d '' desktops < <(find "$appdir" -maxdepth 1 \( -type f -o -type l \) -name '*.desktop' -print0)
          [[ ${#desktops[@]} -eq 1 ]] || fail 'AppImage must contain exactly one root desktop entry'
          desktop=$(realpath -e "${desktops[0]}") || fail 'AppImage desktop entry is missing'
          [[ "$desktop" == "$appdir/"* && -f "$desktop" ]] || fail 'AppImage desktop entry escaped the AppDir'
          exec_line=$(sed -n '/^\[Desktop Entry\]$/,/^\[/s/^Exec=//p' "$desktop")
          [[ "$exec_line" != *$'\n'* ]] || fail 'AppImage desktop entry has ambiguous Exec fields'
          local -a exec_parts
          read -ra exec_parts <<< "$exec_line"
          [[ ${#exec_parts[@]} -ge 1 ]] || fail 'AppImage desktop entry has no Exec command'
          executable=${exec_parts[0]}
          [[ "$executable" =~ ^[A-Za-z0-9_+.-]+$ && "$executable" != . && "$executable" != .. ]] || fail 'AppImage desktop Exec must name a simple binary in usr/bin'
          main_elf=$(realpath -e "$appdir/usr/bin/$executable") || fail 'AppImage main binary is missing'
          [[ "$main_elf" == "$appdir/usr/bin/"* && -f "$main_elf" ]] || fail 'AppImage main binary escaped usr/bin'
          (ulimit -f 128; timeout --kill-after=5s 10s readelf -h "$main_elf" > "$inspection_dir/header" 2>&1) || fail 'AppImage main binary is not a readable ELF'
          grep -Eq 'Class:[[:space:]]+ELF64' "$inspection_dir/header" && \
            grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' "$inspection_dir/header" || fail 'AppImage main binary must be amd64 ELF64'
          (ulimit -f 128; timeout --kill-after=5s 10s readelf -d "$main_elf" > "$inspection_dir/dynamic" 2>&1) || fail 'AppImage main ELF dynamic section could not be inspected'
          grep -q '(NEEDED)' "$inspection_dir/dynamic" || fail 'AppImage main ELF has no dynamic dependencies'
          library_path=
          if [[ -d "$appdir/usr/lib" ]]; then
            library_path=$(realpath -e "$appdir/usr/lib") || fail 'AppImage bundled library directory is invalid'
            [[ "$library_path" == "$appdir/"* ]] || fail 'AppImage bundled library directory escaped the AppDir'
            [[ "$library_path" != *:* ]] || fail 'AppImage library search path contains a colon'
          fi
          (ulimit -f 128; timeout --kill-after=5s 30s env -i PATH="$PATH" LC_ALL=C LD_LIBRARY_PATH="$library_path" \
            ldd "$main_elf" > "$inspection_dir/links" 2>&1) || fail 'AppImage main ELF dependency inspection failed (30 second / bounded output limit)'
          if grep -Eq 'not found|not a dynamic executable|statically linked' "$inspection_dir/links"; then
            fail 'AppImage main ELF has unresolved dependencies or incompatible library versions'
          fi
          provider=not-linked
          if grep -Eq '(^|[[:space:]/])libasound\.so\.2([[:space:]]|$)' "$inspection_dir/links"; then
            asound_path=$(sed -n 's/^[[:space:]]*libasound\.so\.2 => \(.*\) (0x[[:xdigit:]]*)$/\1/p' "$inspection_dir/links")
            [[ -n "$asound_path" && "$asound_path" != *$'\n'* && -f "$asound_path" ]] || fail 'AppImage main ELF dependency closure did not resolve libasound.so.2'
            asound_path=$(realpath -e "$asound_path") || fail 'AppImage libasound resolution is invalid'
            provider=builder-host
            [[ "$asound_path" != "$appdir/"* ]] || provider=bundled
          fi
          printf 'AppImage main ELF dependency closure resolved; libasound.so.2=%s (AppDir usr/lib plus ELF RPATH/RUNPATH and builder-host defaults; not a target-OS runtime test)\n' "$provider"
        )

        validate_relative_path "$APP_PATH" app-path
        [[ "$ARTIFACT_PREFIX" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ && ${#ARTIFACT_PREFIX} -le 63 ]] || \
          fail 'artifact-prefix must be a lower-case portable slug of at most 63 characters'
        [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] || \
          fail 'version must be SemVer without a leading v'
        [[ "$ANDROID_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || fail 'android-version-code must be a positive decimal'
        (( ANDROID_VERSION_CODE <= 2100000000 )) || fail 'android-version-code exceeds the Android maximum'
        [[ "$EXPECTED_CERT_SHA256" =~ ^([[:xdigit:]]{2}:){31}[[:xdigit:]]{2}$ || "$EXPECTED_CERT_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || \
          fail 'expected-signing-cert-sha256 must contain 32 hexadecimal bytes'
        [[ "$OPENBAO_SECRET_PATH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,510}[A-Za-z0-9]$ ]] || fail 'OpenBao signing secret path is invalid'
        validate_relative_path "$OPENBAO_SECRET_PATH" openbao-signing-secret-path
        [[ -f "$token_file" && ! -L "$token_file" ]] || fail 'OpenBao token is unavailable'

        source_real=$(realpath -e "$SOURCE_ROOT") || fail 'source workspace is unavailable'
        app_dir=$(realpath -e "${SOURCE_ROOT}/${APP_PATH}") || fail 'app-path does not exist'
        [[ "$app_dir" == "$source_real/"* && -d "$app_dir" && ! -L "${SOURCE_ROOT}/${APP_PATH}" ]] || fail 'app-path must be a regular directory inside the source workspace'
        if [[ (-f "$app_dir/tauri.conf.json" && ! -L "$app_dir/tauri.conf.json") || (-f "$app_dir/tauri.conf.json5" && ! -L "$app_dir/tauri.conf.json5") ]]; then
          tauri_dir=$app_dir
        elif [[ (-f "$app_dir/src-tauri/tauri.conf.json" && ! -L "$app_dir/src-tauri/tauri.conf.json") || (-f "$app_dir/src-tauri/tauri.conf.json5" && ! -L "$app_dir/src-tauri/tauri.conf.json5") ]]; then
          tauri_dir=$(realpath -e "$app_dir/src-tauri") || fail 'conventional Tauri directory is unavailable'
          [[ "$tauri_dir" == "$source_real/"* && ! -L "$app_dir/src-tauri" ]] || fail 'conventional Tauri directory must remain inside the source workspace'
        else
          fail 'Tauri configuration was not found at the app root or under src-tauri'
        fi
        [[ -f "$tauri_dir/Cargo.toml" && ! -L "$tauri_dir/Cargo.toml" ]] || fail 'effective Tauri directory does not contain a regular Cargo.toml'
        [[ -d "$OUTPUT_ROOT" && ! -L "$OUTPUT_ROOT" ]] || fail 'output workspace is unavailable'
        find "$OUTPUT_ROOT" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

        http_code=$(curl --disable --silent --show-error \
          --noproxy '*' \
          --proto '=https' \
          --max-redirs 0 \
          --connect-timeout 10 \
          --max-time 30 \
          --max-filesize 1048576 \
          --header "X-Vault-Token: $(<"$token_file")" \
          --output "$response_file" \
          --write-out '%{http_code}' \
          "https://openbao.holdenitdown.net/v1/${OPENBAO_SECRET_PATH}") || fail 'OpenBao signing secret request failed'
        [[ "$http_code" == 200 ]] || fail "OpenBao signing secret request returned HTTP ${http_code}"
        [[ $(wc -c < "$response_file") -le 1048576 ]] || fail 'OpenBao signing response is too large'
        jq -e '
          .data.data as $secret
          | ($secret | type == "object")
            and ($secret["keystore-base64"] | type == "string" and length >= 1)
            and ($secret["store-password"] | type == "string" and length >= 1 and length <= 1024)
            and ($secret["key-alias"] | type == "string" and length >= 1 and length <= 256)
            and ($secret["key-password"] | type == "string" and length >= 1 and length <= 1024)
        ' "$response_file" >/dev/null || fail 'OpenBao signing secret does not satisfy the required field contract'

        jq -er '.data.data["keystore-base64"]' "$response_file" | base64 --decode > "$keystore_file" || fail 'keystore-base64 is invalid'
        [[ -s "$keystore_file" && $(wc -c < "$keystore_file") -le 1048576 ]] || fail 'decoded keystore size is invalid'
        ANDROID_SIGNING_STORE_PASSWORD=$(jq -er '.data.data["store-password"]' "$response_file")
        ANDROID_SIGNING_KEY_ALIAS=$(jq -er '.data.data["key-alias"]' "$response_file")
        ANDROID_SIGNING_KEY_PASSWORD=$(jq -er '.data.data["key-password"]' "$response_file")
        export ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_PASSWORD
        rm -f -- "$response_file"

        jq -n --arg version "$VERSION" --argjson versionCode "$ANDROID_VERSION_CODE" \
          '{version: $version, bundle: {android: {versionCode: $versionCode}}}' > "$config_file"

        cd "$app_dir"
        target_directory=$(cargo metadata --manifest-path "$tauri_dir/Cargo.toml" --no-deps --format-version 1 | jq -er '.target_directory | select(type == "string" and startswith("/"))') || \
          fail 'Cargo metadata did not return an absolute target_directory'
        target_directory=$(realpath -m "$target_directory") || fail 'Cargo target_directory could not be resolved'
        [[ "$target_directory" == "$source_real/"* ]] || fail 'Cargo target_directory must remain inside the source workspace'
        pnpm install --frozen-lockfile
        cargo tauri build --target x86_64-unknown-linux-gnu --bundles appimage --config "$config_file"
        cargo tauri android build --apk --config "$config_file"

        target_directory=$(realpath -e "$target_directory") || fail 'Cargo target_directory was not created'
        [[ "$target_directory" == "$source_real/"* && -d "$target_directory" ]] || fail 'Cargo target_directory escaped the source workspace'
        appimage_dir=$(realpath -e "$target_directory/x86_64-unknown-linux-gnu/release/bundle/appimage") || fail 'amd64 AppImage bundle directory was not created'
        [[ "$appimage_dir" == "$source_real/"* && -d "$appimage_dir" ]] || fail 'amd64 AppImage bundle directory escaped the source workspace'
        mapfile -d '' appimages < <(find "$appimage_dir" -maxdepth 1 -type f -name '*.AppImage' -print0)
        [[ ${#appimages[@]} -eq 1 ]] || fail 'build must produce exactly one amd64 AppImage'
        verify_appimage_links "${appimages[0]}"
        android_apk_dir=$(realpath -e "$tauri_dir/gen/android/app/build/outputs/apk") || fail 'effective Tauri directory does not contain Android APK output'
        [[ "$android_apk_dir" == "$source_real/"* && -d "$android_apk_dir" ]] || fail 'Android APK output escaped the source workspace'
        mapfile -d '' unsigned_apks < <(find "$android_apk_dir" -type f -name '*-universal-release-unsigned.apk' -print0)
        [[ ${#unsigned_apks[@]} -eq 1 ]] || fail 'build must produce exactly one universal unsigned release APK'

        zipalign -f -p 4 "${unsigned_apks[0]}" "$aligned_apk"
        apksigner sign \
          --ks "$keystore_file" \
          --ks-key-alias "$ANDROID_SIGNING_KEY_ALIAS" \
          --ks-pass env:ANDROID_SIGNING_STORE_PASSWORD \
          --key-pass env:ANDROID_SIGNING_KEY_PASSWORD \
          --v4-signing-enabled false \
          --out "$signed_apk" \
          "$aligned_apk"
        rm -f -- "$aligned_apk"
        apksigner verify --verbose --print-certs "$signed_apk" > "$verify_file"
        actual_fingerprint=$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}' "$verify_file" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
        expected_fingerprint=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
        [[ "$actual_fingerprint" =~ ^[0-9a-f]{64}$ && "$actual_fingerprint" == "$expected_fingerprint" ]] || fail 'APK signing certificate fingerprint verification failed'
        zipalign -c -p 4 "$signed_apk" >/dev/null

        mv -- "$signed_apk" "$OUTPUT_ROOT/${ARTIFACT_PREFIX}-${VERSION}-android-universal.apk"
        install -m 0755 "${appimages[0]}" "$OUTPUT_ROOT/${ARTIFACT_PREFIX}-${VERSION}-linux-amd64.AppImage"
        [[ $(find "$OUTPUT_ROOT" -maxdepth 1 -type f | wc -l) -eq 2 ]] || fail 'output workspace must contain exactly two assets'
        find "$OUTPUT_ROOT" -maxdepth 1 -type f ! \( -name '*.apk' -o -name '*.AppImage' \) -print -quit | \
          grep -q . && fail 'output workspace contains an unexpected asset type'
        printf '%s\n' 'Tauri release assets built, AppImage main ELF links resolved on builder, and APK signature verified'
