apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-ceph
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-ceph
  name: ar-9e00754fdc49fb0a951aca21
spec:
  annotations:
    description: The OSD node is down, you won`t have access to the physical disks
      mounted in this node
    summary: The OSD node is down.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: ceph_osd_up == 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: warning
  noDataState: OK
  title: OSDNodeDown
  trigger:
    interval: 1m
