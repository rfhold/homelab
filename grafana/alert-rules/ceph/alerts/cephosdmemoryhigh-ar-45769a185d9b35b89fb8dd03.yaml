apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-ceph
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-ceph
  name: ar-45769a185d9b35b89fb8dd03
spec:
  annotations:
    description: >
      Ceph OSD {{ $labels.pod }} on node {{ $labels.node }} has used more than 12
      GiB of working-set memory for the last 10 minutes, and is currently using
      {{ $value | humanize1024 }}B.
    summary: Ceph OSD is using excessive memory.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          sum by (cluster, namespace, pod, node) (
            container_memory_working_set_bytes{cluster="pantheon", namespace="storage", pod=~"rook-ceph-osd-.*", container="osd", job="integrations/kubernetes/cadvisor", image!=""}
            * on (cluster, namespace, pod) group_left(node) topk by (cluster, namespace, pod) (1,
              max by (cluster, namespace, pod, node) (kube_pod_info{cluster="pantheon", namespace="storage", node!=""})
            )
          ) > 12 * 1024 * 1024 * 1024
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 10m0s
  labels:
    severity: warning
  noDataState: OK
  title: CephOSDMemoryHigh
  trigger:
    interval: 1m
