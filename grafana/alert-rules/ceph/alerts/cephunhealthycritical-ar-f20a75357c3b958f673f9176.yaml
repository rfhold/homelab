apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-ceph
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-ceph
  name: ar-f20a75357c3b958f673f9176
spec:
  annotations:
    description: The Ceph cluster has critical issues. Run the ceph -s command on
      any Ceph node to identify the reason and resolve the issue depending on
      the output.
    summary: The Ceph cluster has critical issues.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: ceph_health_status == 2
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: critical
  noDataState: OK
  title: CephUnhealthyCritical
  trigger:
    interval: 1m
