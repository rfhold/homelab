apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-alloy
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-alloy
  name: ar-8ede50049f93ada26a331bdd
spec:
  annotations:
    description: Component evaluations are taking too long under job {{ $labels.job
      }}, component_path {{ $labels.component_path }}, component_id {{
      $labels.component_id }}.
    summary: Component evaluations are taking too long.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum by (cluster, namespace, job, component_path, component_id)
          (rate(alloy_component_evaluation_slow_seconds[10m])) > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: warning
  noDataState: OK
  title: SlowComponentEvaluations
  trigger:
    interval: 1m
