apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-alloy
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-alloy
  name: ar-ee903e0e3e3c0edecc73e56f
spec:
  annotations:
    description: Unhealthy components detected under job {{ $labels.job }}
    summary: Unhealthy components detected.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum by (cluster, namespace, job)
          (alloy_component_controller_running_components{health_type!="healthy"})
          > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: warning
  noDataState: OK
  title: UnhealthyComponents
  trigger:
    interval: 1m
