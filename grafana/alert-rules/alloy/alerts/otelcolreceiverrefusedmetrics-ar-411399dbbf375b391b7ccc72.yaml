apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-alloy
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-alloy
  name: ar-411399dbbf375b391b7ccc72
spec:
  annotations:
    description: The receiver could not push some metric points to the pipeline
      under job {{ $labels.job }}. This could be due to reaching a limit such as
      the ones imposed by otelcol.processor.memory_limiter.
    summary: The receiver pushing metrics to the pipeline success rate is below 95%.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (1 - (
                  sum by (cluster, namespace, job) (rate(otelcol_receiver_refused_metric_points_total{}[1m]))
                  /
                  sum by (cluster, namespace, job) (rate(otelcol_receiver_refused_metric_points_total{}[1m]) + rate(otelcol_receiver_accepted_metric_points_total{}[1m]))
               )
          ) < 0.95
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 10m0s
  labels:
    severity: warning
  noDataState: OK
  title: OtelcolReceiverRefusedMetrics
  trigger:
    interval: 1m
