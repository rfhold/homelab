apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-cert-manager
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-cert-manager
  name: ar-cf16ee27ce8427d682804471
spec:
  annotations:
    dashboard_url: https://grafana.example.com/d/TvuRo2iMk/cert-manager
    description: Depending on the rate limit, cert-manager may be unable to generate
      certificates for up to a week.
    runbook_url: https://gitlab.com/uneeq-oss/cert-manager-mixin/-/blob/master/RUNBOOK.md#certmanagerhittingratelimits
    summary: Cert manager hitting LetsEncrypt rate limits.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          sum by (host) (
            rate(certmanager_http_acme_client_request_count{status="429"}[5m])
          ) > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: critical
  noDataState: OK
  title: CertManagerHittingRateLimits
  trigger:
    interval: 1m
