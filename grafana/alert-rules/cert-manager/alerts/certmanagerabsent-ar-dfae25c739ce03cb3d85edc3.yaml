apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-cert-manager
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-cert-manager
  name: ar-dfae25c739ce03cb3d85edc3
spec:
  annotations:
    description: New certificates will not be able to be minted, and existing ones
      can't be renewed until cert-manager is back.
    runbook_url: https://gitlab.com/uneeq-oss/cert-manager-mixin/-/blob/master/RUNBOOK.md#certmanagerabsent
    summary: Cert Manager has disappeared from Prometheus service discovery.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: absent(certmanager_clock_time_seconds)
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 10m0s
  labels:
    severity: critical
  noDataState: OK
  title: CertManagerAbsent
  trigger:
    interval: 1m
