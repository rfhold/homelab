apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-cert-manager
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-cert-manager
  name: ar-79ebfb76294c7910f7991fae
spec:
  annotations:
    dashboard_url: https://grafana.example.com/d/TvuRo2iMk/cert-manager
    description: The domain that this cert covers will be unavailable after {{
      $value | humanizeDuration }}. Clients using endpoints that this cert
      protects will start to fail in {{ $value | humanizeDuration }}.
    runbook_url: https://gitlab.com/uneeq-oss/cert-manager-mixin/-/blob/master/RUNBOOK.md#certmanagercertexpirysoon
    summary: The cert is nearing expiry, it should have renewed over a week ago.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          avg by (exported_namespace, namespace, name) (
            certmanager_certificate_expiration_timestamp_seconds - time()
          ) < (21 * 24 * 3600) # 21 days in seconds
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 1h0m0s
  labels:
    severity: warning
  noDataState: OK
  title: CertManagerCertExpirySoon
  trigger:
    interval: 1m
