apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-traefik
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-traefik
  name: ar-44a0045e69db79ec25bb17d0
spec:
  annotations:
    description: |
      Traefik is failing to reload its config in {{ $labels.job }}.
    summary: Traefik is failing to reload its configuration.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum by (job) (rate(traefik_config_reloads_failure_total{}[5m])) > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Service
    asserts_severity: critical
    severity: critical
  noDataState: OK
  title: TraefikConfigReloadFailuresIncreasing
  trigger:
    interval: 1m
