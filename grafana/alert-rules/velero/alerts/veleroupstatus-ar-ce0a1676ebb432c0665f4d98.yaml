apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-velero
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-velero
  name: ar-ce0a1676ebb432c0665f4d98
spec:
  annotations:
    description: >
      Cannot find any metrics related to Velero on {{ $labels.instance }}. This
      may indicate further issues with Velero or the scraping agent.
    summary: Velero is down.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: up{job=~"integrations/velero"} != 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: critical
  noDataState: OK
  title: VeleroUpStatus
  trigger:
    interval: 1m
