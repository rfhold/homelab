apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-velero
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-velero
  name: ar-7fa4fc6c51a3481232dfb259
spec:
  annotations:
    description: Backup duration on {{ $labels.instance }} is higher than the
      average duration over the past 48 hours. This could indicate performance
      issues or network congestion. The current value is {{ $value | printf
      "%.2f" }} seconds.
    summary: Velero backups taking longer than usual.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: histogram_quantile(0.5,
          sum(rate(velero_backup_duration_seconds_bucket{job=~"integrations/velero"}[5m]))
          by (le, schedule)) > 1.2 * 1.2 * avg_over_time(histogram_quantile(0.5,
          sum(rate(velero_backup_duration_seconds_bucket{job=~"integrations/velero"}[48h]))
          by (le, schedule))[5m:])
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: warning
  noDataState: OK
  title: VeleroHighBackupDuration
  trigger:
    interval: 1m
