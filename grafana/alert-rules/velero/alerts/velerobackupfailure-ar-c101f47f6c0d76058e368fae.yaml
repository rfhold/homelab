apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-velero
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-velero
  name: ar-c101f47f6c0d76058e368fae
spec:
  annotations:
    description: Backup failures detected on {{ $labels.instance }}. This could lead
      to data loss or inability to recover in case of a disaster.
    summary: Velero backup failures detected.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: increase(velero_backup_failure_total{job=~"integrations/velero"}[5m]) > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: critical
  noDataState: OK
  title: VeleroBackupFailure
  trigger:
    interval: 1m
