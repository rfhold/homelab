apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-velero
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-velero
  name: ar-d9a435b69f3b4e38c525696c
spec:
  annotations:
    description: Restore failures detected on {{ $labels.instance }}. This could
      prevent timely data recovery and business continuity.
    summary: Velero restore failures detected.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: increase(velero_restore_failed_total{job=~"integrations/velero"}[5m]) > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: critical
  noDataState: OK
  title: VeleroHighRestoreFailureRate
  trigger:
    interval: 1m
