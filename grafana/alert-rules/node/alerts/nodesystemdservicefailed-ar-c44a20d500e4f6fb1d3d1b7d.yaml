apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-c44a20d500e4f6fb1d3d1b7d
spec:
  annotations:
    description: >
      Systemd service {{ $labels.name }} has entered failed state at {{
      $labels.instance }}.

      If this service is not required anymore, remove it or run `systemctl
      reset-failed {{ $labels.name }}` in order to reset the failed counter.
    summary: Systemd service has entered failed state.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: node_systemd_unit_state{job=~"integrations/(node_exporter|unix)",
          state="failed"} == 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: warning
    severity: warning
  noDataState: OK
  title: NodeSystemdServiceFailed
  trigger:
    interval: 1m
