apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-9012ac2ffcd68b72a71d6a3b
spec:
  annotations:
    description: Systemd service {{ $labels.name }} has been restarted too many
      times at {{ $labels.instance }} for the last 15 minutes. Please check if
      service is crash looping.
    summary: Systemd service keeps restaring, possibly crash looping.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: increase(node_systemd_service_restart_total{job=~"integrations/(node_exporter|unix)"}[5m])
          > 2
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: warning
    severity: warning
  noDataState: OK
  title: NodeSystemdServiceCrashlooping
  trigger:
    interval: 1m
