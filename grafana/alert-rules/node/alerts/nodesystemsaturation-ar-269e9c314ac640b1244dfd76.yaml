apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-269e9c314ac640b1244dfd76
spec:
  annotations:
    description: >
      System load per core at {{ $labels.instance }} has been above 2 for the
      last 15 minutes, is currently at {{ printf "%.2f" $value }}.

      This might indicate this instance resources saturation and can cause it
      becoming unresponsive.
    summary: System saturated, load per core is very high.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          node_load1{job=~"integrations/(node_exporter|unix)"}

          / count without (cpu, mode)
          (node_cpu_seconds_total{job=~"integrations/(node_exporter|unix)",
          mode="idle"}) > 2
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: warning
    severity: warning
  noDataState: OK
  title: NodeSystemSaturation
  trigger:
    interval: 1m
