apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-31da8a51d0e96cf84d79ecf5
spec:
  annotations:
    description: RAID array '{{ $labels.device }}' at {{ $labels.instance }} is in
      degraded state due to one or more disks failures. Number of spare drives
      is insufficient to fix issue automatically.
    summary: RAID Array is degraded.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: node_md_disks_required{job=~"integrations/(node_exporter|unix)",device!=""}
          - ignoring (state)
          (node_md_disks{state="active",job=~"integrations/(node_exporter|unix)",device!=""})
          > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: critical
    severity: critical
  noDataState: OK
  title: NodeRAIDDegraded
  trigger:
    interval: 1m
