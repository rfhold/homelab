apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-29aaaee450a5a85ca9627a96
spec:
  annotations:
    description: >
      CPU usage at {{ $labels.instance }} has been above 90% for the last 15
      minutes, is currently at {{ printf "%.2f" $value }}%.

      Note that 'iowait' CPU mode is excluded from total utilization.
    summary: High CPU usage.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum without(mode) (avg without (cpu)
          (rate(node_cpu_seconds_total{job=~"integrations/(node_exporter|unix)",
          mode!~"idle|iowait"}[2m]))) * 100 > 90
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: info
    severity: info
  noDataState: OK
  title: NodeCPUHighUsage
  trigger:
    interval: 1m
