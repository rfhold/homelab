apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-c05572b576f591c8959cae02
spec:
  annotations:
    description: Node {{ $labels.instance }} has rebooted {{ $value | humanize }}
      seconds ago.
    summary: Node has rebooted.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (time() -
          node_boot_time_seconds{job=~"integrations/(node_exporter|unix)"}) <
          600

          and

          (time() -
          (node_boot_time_seconds{job=~"integrations/(node_exporter|unix)"}
          offset 10m)) > 600
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  labels:
    severity: info
  noDataState: OK
  title: NodeHasRebooted
  trigger:
    interval: 1m
