apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-c24b2972a5625afbb718ffcc
spec:
  annotations:
    description: >
      Memory is filling up at {{ $labels.instance }}, has been above 90% for the
      last 15 minutes, is currently at {{ printf "%.2f" $value }}%.
    summary: Host is running out of memory.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: 100 -
          (node_memory_MemAvailable_bytes{job=~"integrations/(node_exporter|unix)"}
          / node_memory_MemTotal_bytes{job=~"integrations/(node_exporter|unix)"}
          * 100) > 90
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: warning
    severity: warning
  noDataState: OK
  title: NodeMemoryHighUtilization
  trigger:
    interval: 1m
