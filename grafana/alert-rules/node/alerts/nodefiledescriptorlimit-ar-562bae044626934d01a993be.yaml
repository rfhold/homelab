apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-562bae044626934d01a993be
spec:
  annotations:
    description: File descriptors limit at {{ $labels.instance }} is currently at {{
      printf "%.2f" $value }}%.
    summary: Kernel is predicted to exhaust file descriptors limit soon.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (
            node_filefd_allocated{job=~"integrations/(node_exporter|unix)"} * 100 / node_filefd_maximum{job=~"integrations/(node_exporter|unix)"} > 70
          )
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: warning
    severity: warning
  noDataState: OK
  title: NodeFileDescriptorLimit
  trigger:
    interval: 1m
