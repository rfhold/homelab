apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-11f31f0274e0e5c896b4be95
spec:
  annotations:
    description: Node Exporter text file collector on {{ $labels.instance }} failed
      to scrape.
    summary: Node Exporter text file collector failed to scrape.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: node_textfile_scrape_error{job=~"integrations/(node_exporter|unix)"} == 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: warning
    severity: warning
  noDataState: OK
  title: NodeTextFileCollectorScrapeError
  trigger:
    interval: 1m
