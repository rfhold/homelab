apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-58f71b7806f7d012fb6e320f
spec:
  annotations:
    description: Clock at {{ $labels.instance }} is not synchronising. Ensure NTP is
      configured on this host.
    summary: Clock not synchronising.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          min_over_time(node_timex_sync_status{job=~"integrations/(node_exporter|unix)"}[5m]) == 0
          and
          node_timex_maxerror_seconds{job=~"integrations/(node_exporter|unix)"} >= 16
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 10m0s
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: warning
    severity: warning
  noDataState: OK
  title: NodeClockNotSynchronising
  trigger:
    interval: 1m
