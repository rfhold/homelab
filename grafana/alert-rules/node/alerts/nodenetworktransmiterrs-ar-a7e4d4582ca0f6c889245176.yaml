apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-a7e4d4582ca0f6c889245176
spec:
  annotations:
    description: '{{ $labels.instance }} interface {{ $labels.device }} has
      encountered {{ printf "%.0f" $value }} transmit errors in the last two
      minutes.'
    summary: Network interface is reporting many transmit errors.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: rate(node_network_transmit_errs_total{job=~"integrations/(node_exporter|unix)"}[2m])
          /
          rate(node_network_transmit_packets_total{job=~"integrations/(node_exporter|unix)"}[2m])
          > 0.01
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 1h0m0s
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: warning
    severity: warning
  noDataState: OK
  title: NodeNetworkTransmitErrs
  trigger:
    interval: 1m
