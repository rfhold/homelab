apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: ar-8bce30d92cf2a071722c25bc
spec:
  annotations:
    description: "{{ $labels.instance }} {{ $value | humanizePercentage }} of
      conntrack entries are used."
    summary: Number of conntrack are getting close to the limit.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: (node_nf_conntrack_entries{job=~"integrations/(node_exporter|unix)"} /
          node_nf_conntrack_entries_limit) > 0.75
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  labels:
    asserts_alert_category: failure
    asserts_entity_type: Node
    asserts_severity: warning
    severity: warning
  noDataState: OK
  title: NodeHighNumberConntrackEntriesUsed
  trigger:
    interval: 1m
