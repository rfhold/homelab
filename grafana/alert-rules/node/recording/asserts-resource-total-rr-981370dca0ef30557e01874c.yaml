apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: rr-981370dca0ef30557e01874c
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: rate(node_disk_io_time_seconds_total{job=~"integrations/(node_exporter|unix)",
          asserts_env!="", device!=""}[5m])
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    asserts_entity_type: Node
    asserts_resource_type: disk:utilization
    asserts_source: node_exporter
  metric: asserts:resource:total
  targetDatasourceUID: mimir
  title: asserts:resource:total
  trigger:
    interval: 1m
