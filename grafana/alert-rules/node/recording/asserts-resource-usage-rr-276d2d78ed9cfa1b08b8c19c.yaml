apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: rr-276d2d78ed9cfa1b08b8c19c
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          1 - avg without (cpu) (
            sum without (mode) (rate(node_cpu_seconds_total{job=~"integrations/(node_exporter|unix)", asserts_env!="", mode=~"idle|iowait|steal"}[5m]))
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    asserts_entity_type: Node
    asserts_resource_type: cpu:usage
    asserts_source: node_exporter
  metric: asserts:resource:usage
  targetDatasourceUID: mimir
  title: asserts:resource:usage
  trigger:
    interval: 1m
