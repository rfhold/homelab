apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: rr-68321d52b7c7e52b1ff8aa47
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          1 - avg without (cpu) (
            sum without (mode) (rate(node_cpu_seconds_total{job=~"integrations/(node_exporter|unix)", mode=~"idle|iowait|steal"}[5m]))
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: instance:node_cpu_utilisation:rate5m
  targetDatasourceUID: mimir
  title: instance:node_cpu_utilisation:rate5m
  trigger:
    interval: 1m
