apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: rr-cc6beeadb4919918d3623071
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          sum without (device) (
            rate(node_network_transmit_bytes_total{job=~"integrations/(node_exporter|unix)", asserts_env!="", device!="lo"}[5m])
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    asserts_entity_type: Node
    asserts_resource_type: network:rx_bytes
    asserts_source: node_exporter
  metric: asserts:resource:total
  targetDatasourceUID: mimir
  title: asserts:resource:total
  trigger:
    interval: 1m
