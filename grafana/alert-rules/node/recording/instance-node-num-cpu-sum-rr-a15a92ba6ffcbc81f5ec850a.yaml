apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: rr-a15a92ba6ffcbc81f5ec850a
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          count without (cpu, mode) (
            node_cpu_seconds_total{job=~"integrations/(node_exporter|unix)",mode="idle"}
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: instance:node_num_cpu:sum
  targetDatasourceUID: mimir
  title: instance:node_num_cpu:sum
  trigger:
    interval: 1m
