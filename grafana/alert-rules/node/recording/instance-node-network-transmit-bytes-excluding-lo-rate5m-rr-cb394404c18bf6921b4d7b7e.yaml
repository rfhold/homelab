apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: rr-cb394404c18bf6921b4d7b7e
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          sum without (device) (
            rate(node_network_transmit_bytes_total{job=~"integrations/(node_exporter|unix)", device!="lo"}[5m])
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: instance:node_network_transmit_bytes_excluding_lo:rate5m
  targetDatasourceUID: mimir
  title: instance:node_network_transmit_bytes_excluding_lo:rate5m
  trigger:
    interval: 1m
