apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-node
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-node
  name: rr-13cb9b5e79265e42cee6d58b
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          1 - (
            (
              node_memory_MemAvailable_bytes{job=~"integrations/(node_exporter|unix)"}
              or
              (
                node_memory_Buffers_bytes{job=~"integrations/(node_exporter|unix)"}
                +
                node_memory_Cached_bytes{job=~"integrations/(node_exporter|unix)"}
                +
                node_memory_MemFree_bytes{job=~"integrations/(node_exporter|unix)"}
                +
                node_memory_Slab_bytes{job=~"integrations/(node_exporter|unix)"}
              )
            )
          /
            node_memory_MemTotal_bytes{job=~"integrations/(node_exporter|unix)"}
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: instance:node_memory_utilisation:ratio
  targetDatasourceUID: mimir
  title: instance:node_memory_utilisation:ratio
  trigger:
    interval: 1m
