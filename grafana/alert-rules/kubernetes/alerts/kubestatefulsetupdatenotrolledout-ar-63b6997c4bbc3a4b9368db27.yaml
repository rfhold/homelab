apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: ar-63b6997c4bbc3a4b9368db27
spec:
  annotations:
    description: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }}
      update has not been rolled out.
    runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubestatefulsetupdatenotrolledout
    summary: StatefulSet update has not been rolled out.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (
            max by(namespace, statefulset, job, cluster) (
              kube_statefulset_status_current_revision{job="integrations/kubernetes/kube-state-metrics"}
                unless
              kube_statefulset_status_update_revision{job="integrations/kubernetes/kube-state-metrics"}
            )
              * on(namespace, statefulset, job, cluster)
            (
              kube_statefulset_replicas{job="integrations/kubernetes/kube-state-metrics"}
                !=
              kube_statefulset_status_replicas_updated{job="integrations/kubernetes/kube-state-metrics"}
            )
          )  and on(namespace, statefulset, job, cluster) (
            changes(kube_statefulset_status_replicas_updated{job="integrations/kubernetes/kube-state-metrics"}[5m])
              ==
            0
          )
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: warning
  noDataState: OK
  title: KubeStatefulSetUpdateNotRolledOut
  trigger:
    interval: 1m
