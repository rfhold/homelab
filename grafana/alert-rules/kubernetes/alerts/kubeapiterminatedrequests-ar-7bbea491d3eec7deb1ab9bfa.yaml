apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: ar-7bbea491d3eec7deb1ab9bfa
spec:
  annotations:
    description: The kubernetes apiserver has terminated {{ $value |
      humanizePercentage }} of its incoming requests.
    runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeapiterminatedrequests
    summary: The kubernetes apiserver has terminated {{ $value | humanizePercentage
      }} of its incoming requests.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum by(cluster)
          (rate(apiserver_request_terminations_total{job="integrations/kubernetes/kube-apiserver"}[10m]))
          / ( sum by(cluster)
          (rate(apiserver_request_total{job="integrations/kubernetes/kube-apiserver"}[10m]))
          + sum by(cluster)
          (rate(apiserver_request_terminations_total{job="integrations/kubernetes/kube-apiserver"}[10m]))
          ) > 0.20
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: warning
  noDataState: OK
  title: KubeAPITerminatedRequests
  trigger:
    interval: 1m
