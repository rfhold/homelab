apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: ar-1460b28a41e8651d8b38a2f2
spec:
  annotations:
    description: The API server is burning too much error budget.
    runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeapierrorbudgetburn
    summary: The API server is burning too much error budget.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          sum by(cluster) (apiserver_request:burnrate1h) > (14.40 * 0.01000)
          and on(cluster)
          sum by(cluster) (apiserver_request:burnrate5m) > (14.40 * 0.01000)
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 2m0s
  labels:
    long: 1h
    severity: critical
    short: 5m
  noDataState: OK
  title: KubeAPIErrorBudgetBurn
  trigger:
    interval: 1m
