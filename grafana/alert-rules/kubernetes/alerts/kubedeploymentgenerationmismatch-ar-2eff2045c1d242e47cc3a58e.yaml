apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: ar-2eff2045c1d242e47cc3a58e
spec:
  annotations:
    description: Deployment generation for {{ $labels.namespace }}/{{
      $labels.deployment }} does not match, this indicates that the Deployment
      has failed but has not been rolled back.
    runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubedeploymentgenerationmismatch
    summary: Deployment generation mismatch due to possible roll-back
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          kube_deployment_status_observed_generation{job="integrations/kubernetes/kube-state-metrics"}
            !=
          kube_deployment_metadata_generation{job="integrations/kubernetes/kube-state-metrics"}
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: warning
  noDataState: OK
  title: KubeDeploymentGenerationMismatch
  trigger:
    interval: 1m
