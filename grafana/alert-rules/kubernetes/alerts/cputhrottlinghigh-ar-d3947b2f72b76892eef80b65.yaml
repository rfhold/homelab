apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: ar-d3947b2f72b76892eef80b65
spec:
  annotations:
    description: "{{ $value | humanizePercentage }} throttling of CPU in namespace
      {{ $labels.namespace }} for container {{ $labels.container }} in pod {{
      $labels.pod }}."
    runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-cputhrottlinghigh
    summary: Processes experience elevated CPU throttling.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(
                container_cpu_cfs_throttled_periods_total{container!="", job="integrations/kubernetes/cadvisor", }
              [5m])
            )
          )

          / on (cluster, namespace, pod, container, instance) group_left

          sum without (id, metrics_path, name, image, endpoint, job, node) (
            topk by (cluster, namespace, pod, container, instance) (1,
              increase(
                container_cpu_cfs_periods_total{job="integrations/kubernetes/cadvisor", }
              [5m])
            )
          )

          > ( 25 / 100 )
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: info
  noDataState: OK
  title: CPUThrottlingHigh
  trigger:
    interval: 1m
