apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: ar-45107dd364593389c6c2cf50
spec:
  annotations:
    description: DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has not
      finished or progressed for at least 15m.
    runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubedaemonsetrolloutstuck
    summary: DaemonSet rollout is stuck.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (
            (
              kube_daemonset_status_current_number_scheduled{job="integrations/kubernetes/kube-state-metrics"}
                !=
              kube_daemonset_status_desired_number_scheduled{job="integrations/kubernetes/kube-state-metrics"}
            ) or (
              kube_daemonset_status_number_misscheduled{job="integrations/kubernetes/kube-state-metrics"}
                !=
              0
            ) or (
              kube_daemonset_status_updated_number_scheduled{job="integrations/kubernetes/kube-state-metrics"}
                !=
              kube_daemonset_status_desired_number_scheduled{job="integrations/kubernetes/kube-state-metrics"}
            ) or (
              kube_daemonset_status_number_available{job="integrations/kubernetes/kube-state-metrics"}
                !=
              kube_daemonset_status_desired_number_scheduled{job="integrations/kubernetes/kube-state-metrics"}
            )
          ) and (
            changes(kube_daemonset_status_updated_number_scheduled{job="integrations/kubernetes/kube-state-metrics"}[5m])
              ==
            0
          )
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: warning
  noDataState: OK
  title: KubeDaemonSetRolloutStuck
  trigger:
    interval: 1m
