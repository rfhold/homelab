apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: ar-e82199e5890729e66c6e1d23
spec:
  annotations:
    description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{
      $labels.container }}) is in waiting state (reason: "CrashLoopBackOff").'
    runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepodcrashlooping
    summary: Pod is crash looping.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff",
          job="integrations/kubernetes/kube-state-metrics"}[5m]) >= 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: warning
  noDataState: OK
  title: KubePodCrashLooping
  trigger:
    interval: 1m
