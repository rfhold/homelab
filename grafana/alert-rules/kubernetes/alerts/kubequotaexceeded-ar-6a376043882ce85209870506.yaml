apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: ar-6a376043882ce85209870506
spec:
  annotations:
    description: Namespace {{ $labels.namespace }} is using {{ $value |
      humanizePercentage }} of its {{ $labels.resource }} quota.
    runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubequotaexceeded
    summary: Namespace quota has exceeded the limits.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          kube_resourcequota{job="integrations/kubernetes/kube-state-metrics",
          type="used"}
            / ignoring(instance, job, type)
          (kube_resourcequota{job="integrations/kubernetes/kube-state-metrics",
          type="hard"} > 0)
            > 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: warning
  noDataState: OK
  title: KubeQuotaExceeded
  trigger:
    interval: 1m
