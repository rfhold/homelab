apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: ar-adec8d5f025c171381b6336e
spec:
  annotations:
    description: The PersistentVolume claimed by {{ $labels.persistentvolumeclaim }}
      in Namespace {{ $labels.namespace }} {{ with $labels.cluster -}} on
      Cluster {{ . }} {{- end }} is only {{ $value | humanizePercentage }} free.
    runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepersistentvolumefillingup
    summary: PersistentVolume is filling up.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (
            kubelet_volume_stats_available_bytes{job="integrations/kubernetes/kubelet"}
              /
            kubelet_volume_stats_capacity_bytes{job="integrations/kubernetes/kubelet"}
          ) < 0.03

          and

          kubelet_volume_stats_used_bytes{job="integrations/kubernetes/kubelet"}
          > 0

          unless on(cluster, namespace, persistentvolumeclaim)

          kube_persistentvolumeclaim_access_mode{ access_mode="ReadOnlyMany"} ==
          1

          unless on(cluster, namespace, persistentvolumeclaim)

          kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"}
          == 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 1m0s
  labels:
    severity: critical
  noDataState: OK
  title: KubePersistentVolumeFillingUp
  trigger:
    interval: 1m
