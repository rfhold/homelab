apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: ar-7d689bb77f0762c984436290
spec:
  annotations:
    description: 'pod/{{ $labels.pod }} in namespace {{ $labels.namespace }} on
      container {{ $labels.container}} has been in waiting state for longer than
      1 hour. (reason: "{{ $labels.reason }}").'
    runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubecontainerwaiting
    summary: Pod container waiting longer than 1 hour
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff",
          job="integrations/kubernetes/kube-state-metrics"} > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 1h0m0s
  labels:
    severity: warning
  noDataState: OK
  title: KubeContainerWaiting
  trigger:
    interval: 1m
