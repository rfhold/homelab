apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: rr-4271fd6c48fbdd369859d925
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: histogram_quantile(0.99, sum by (cluster, le, resource)
          (rate(apiserver_request_sli_duration_seconds_bucket{job="integrations/kubernetes/kube-apiserver",verb=~"LIST|GET",subresource!~"proxy|attach|log|exec|portforward"}[5m])))
          > 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    quantile: "0.99"
    verb: read
  metric: cluster_quantile:apiserver_request_sli_duration_seconds:histogram_quantile
  targetDatasourceUID: mimir
  title: cluster_quantile:apiserver_request_sli_duration_seconds:histogram_quantile
  trigger:
    interval: 1m
