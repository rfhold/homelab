apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: rr-e52ed66ab99c829f6cf72294
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          histogram_quantile(
            0.99,
            sum(rate(kubelet_pleg_relist_duration_seconds_bucket{job="integrations/kubernetes/kubelet"}[5m])) by (cluster, instance, le)
            * on(cluster, instance) group_left (node)
            max by (cluster, instance, node) (kubelet_node_name{job="integrations/kubernetes/kubelet"})
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    quantile: "0.99"
  metric: node_quantile:kubelet_pleg_relist_duration_seconds:histogram_quantile
  targetDatasourceUID: mimir
  title: node_quantile:kubelet_pleg_relist_duration_seconds:histogram_quantile
  trigger:
    interval: 1m
