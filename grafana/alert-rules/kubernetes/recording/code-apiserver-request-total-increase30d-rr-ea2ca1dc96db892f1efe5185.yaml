apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: rr-ea2ca1dc96db892f1efe5185
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum by (cluster, code)
          (code_verb:apiserver_request_total:increase30d{verb=~"LIST|GET"})
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    verb: read
  metric: code:apiserver_request_total:increase30d
  targetDatasourceUID: mimir
  title: code:apiserver_request_total:increase30d
  trigger:
    interval: 3m
