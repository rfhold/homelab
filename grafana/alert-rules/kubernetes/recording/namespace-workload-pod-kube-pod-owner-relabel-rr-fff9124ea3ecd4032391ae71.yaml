apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: rr-fff9124ea3ecd4032391ae71
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          max by (cluster, namespace, workload, pod) (
            label_replace(
              kube_pod_owner{job="integrations/kubernetes/kube-state-metrics", owner_kind="Node"},
            "workload", "$1", "pod", "(.+)")
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    workload_type: staticpod
  metric: namespace_workload_pod:kube_pod_owner:relabel
  targetDatasourceUID: mimir
  title: namespace_workload_pod:kube_pod_owner:relabel
  trigger:
    interval: 1m
