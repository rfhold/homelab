apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: rr-c14258d56b4606df439cf82a
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          count by (cluster, node) (
            node_cpu_seconds_total{mode="idle",job="integrations/node_exporter"}
            * on (cluster, namespace, pod) group_left(node)
            topk by(cluster, namespace, pod) (1, node_namespace_pod:kube_pod_info:)
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: node:node_num_cpu:sum
  targetDatasourceUID: mimir
  title: node:node_num_cpu:sum
  trigger:
    interval: 1m
