apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-kubernetes
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-kubernetes
  name: rr-83258615f8f2c58ba9ea214c
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum by (cluster, verb, scope, le)
          (avg_over_time(cluster_verb_scope_le:apiserver_request_sli_duration_seconds_bucket:increase1h[30d])
          * 24 * 30)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_verb_scope_le:apiserver_request_sli_duration_seconds_bucket:increase30d
  targetDatasourceUID: mimir
  title: cluster_verb_scope_le:apiserver_request_sli_duration_seconds_bucket:increase30d
  trigger:
    interval: 3m
