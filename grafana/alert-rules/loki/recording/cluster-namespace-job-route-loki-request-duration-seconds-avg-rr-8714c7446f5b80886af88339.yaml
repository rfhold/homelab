apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-loki
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-loki
  name: rr-8714c7446f5b80886af88339
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum(rate(loki_request_duration_seconds_sum[1m])) by (cluster, namespace,
          job, route) / sum(rate(loki_request_duration_seconds_count[1m])) by
          (cluster, namespace, job, route)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_namespace_job_route:loki_request_duration_seconds:avg
  targetDatasourceUID: mimir
  title: cluster_namespace_job_route:loki_request_duration_seconds:avg
  trigger:
    interval: 1m
