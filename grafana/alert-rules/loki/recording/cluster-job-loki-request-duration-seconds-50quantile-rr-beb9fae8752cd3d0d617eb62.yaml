apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-loki
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-loki
  name: rr-beb9fae8752cd3d0d617eb62
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: histogram_quantile(0.50,
          sum(rate(loki_request_duration_seconds_bucket[1m])) by (le, cluster,
          job))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_job:loki_request_duration_seconds:50quantile
  targetDatasourceUID: mimir
  title: cluster_job:loki_request_duration_seconds:50quantile
  trigger:
    interval: 1m
