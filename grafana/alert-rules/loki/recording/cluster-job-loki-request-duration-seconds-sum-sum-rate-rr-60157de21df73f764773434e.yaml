apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-loki
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-loki
  name: rr-60157de21df73f764773434e
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum(rate(loki_request_duration_seconds_sum[1m])) by (cluster, job)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_job:loki_request_duration_seconds_sum:sum_rate
  targetDatasourceUID: mimir
  title: cluster_job:loki_request_duration_seconds_sum:sum_rate
  trigger:
    interval: 1m
