apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-loki
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-loki
  name: rr-682333c24728988be5ebd96e
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum(rate(loki_request_duration_seconds_sum[1m])) by (cluster, job, route)
          / sum(rate(loki_request_duration_seconds_count[1m])) by (cluster, job,
          route)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_job_route:loki_request_duration_seconds:avg
  targetDatasourceUID: mimir
  title: cluster_job_route:loki_request_duration_seconds:avg
  trigger:
    interval: 1m
