apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-loki
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-loki
  name: ar-35b5174894db4c03cdce4485
spec:
  annotations:
    description: >
      {{ $labels.cluster }} {{ $labels.namespace }} has had {{ printf "%.0f"
      $value }} compactors running for more than 5m. Only one compactor should
      run at a time.
    summary: Loki deployment is running more than one compactor.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum(loki_boltdb_shipper_compactor_running) by (cluster, namespace) > 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: warning
  noDataState: OK
  title: LokiTooManyCompactorsRunning
  trigger:
    interval: 1m
