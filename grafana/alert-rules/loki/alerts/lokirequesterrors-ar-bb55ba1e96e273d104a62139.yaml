apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-loki
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-loki
  name: ar-bb55ba1e96e273d104a62139
spec:
  annotations:
    description: >
      {{ $labels.cluster }} {{ $labels.job }} {{ $labels.route }} is
      experiencing {{ printf "%.2f" $value }}% errors.
    summary: Loki request error rate is high.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          100 *
          sum(rate(loki_request_duration_seconds_count{status_code=~"5.."}[2m]))
          by (cluster, namespace, job, route)
            /
          sum(rate(loki_request_duration_seconds_count[2m])) by (cluster,
          namespace, job, route)
            > 10
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: critical
  noDataState: OK
  title: LokiRequestErrors
  trigger:
    interval: 1m
