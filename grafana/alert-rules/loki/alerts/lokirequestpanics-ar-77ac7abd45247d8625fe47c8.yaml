apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-loki
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-loki
  name: ar-77ac7abd45247d8625fe47c8
spec:
  annotations:
    description: >
      {{ $labels.cluster }} {{ $labels.job }} is experiencing {{ printf "%.2f"
      $value }}% increase of panics.
    summary: Loki requests are causing code panics.
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum(increase(loki_panic_total[10m])) by (cluster, namespace, job) > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  labels:
    severity: critical
  noDataState: OK
  title: LokiRequestPanics
  trigger:
    interval: 1m
