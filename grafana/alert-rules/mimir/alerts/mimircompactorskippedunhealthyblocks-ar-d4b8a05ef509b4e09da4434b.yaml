apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-d4b8a05ef509b4e09da4434b
spec:
  annotations:
    message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} has found and ignored unhealthy blocks.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimircompactorskippedunhealthyblocks
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: increase(cortex_compactor_blocks_marked_for_no_compaction_total[5m]) > 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 30m0s
  labels:
    severity: critical
  noDataState: OK
  title: MimirCompactorSkippedUnhealthyBlocks
  trigger:
    interval: 1m
