apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-3d3848289d9bb51eaa9ba830
spec:
  annotations:
    message: >
      The route {{ $labels.route }} in {{ $labels.cluster }}/{{
      $labels.namespace }} is experiencing {{ printf "%.2f" $value }}% errors.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirrequesterrors
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          # The following 5xx errors considered as non-error:

          # - 529: used by distributor rate limiting (using 529 instead of 429
          to let the client retry)

          # - 598: used by GEM gateway when the client is very slow to send the
          request and the gateway times out reading the request body

          (
            sum by (cluster, namespace, job, route) (rate(cortex_request_duration_seconds_count{status_code=~"5..", status_code!~"529|598", route!~"ready|debug_pprof"}[1m]))
            /
            sum by (cluster, namespace, job, route) (rate(cortex_request_duration_seconds_count{route!~"ready|debug_pprof"}[1m]))
          ) * 100 > 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    histogram: classic
    severity: critical
  noDataState: OK
  title: MimirRequestErrors
  trigger:
    interval: 1m
