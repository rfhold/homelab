apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-f45d9747b6b4492c3e65ef7f
spec:
  annotations:
    message: Mimir ingesters in {{ $labels.cluster }}/{{ $labels.namespace }} have
      fewer ingesters consuming than active partitions.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirfeweringestersconsumingthanactivepartitions
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: max(cortex_partition_ring_partitions{name="ingester-partitions",
          state="Active"}) by (cluster, namespace) >
          count(count(cortex_ingest_storage_reader_last_consumed_offset{}) by
          (cluster, namespace, partition)) by (cluster, namespace)
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: critical
  noDataState: OK
  title: MimirFewerIngestersConsumingThanActivePartitions
  trigger:
    interval: 1m
