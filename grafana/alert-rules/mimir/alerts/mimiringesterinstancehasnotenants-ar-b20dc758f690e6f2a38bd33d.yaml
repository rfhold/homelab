apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-b20dc758f690e6f2a38bd33d
spec:
  annotations:
    message: Mimir ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} has no tenants assigned.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimiringesterinstancehasnotenants
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (
            (min by(cluster, namespace, pod) (cortex_ingester_memory_users) == 0)
            unless
            (max by(cluster, namespace, pod) (cortex_lifecycler_read_only) > 0)
          )

          and on (cluster, namespace)

          # Only if there are more timeseries than would be expected due to
          continuous testing load

          (
            ( # Classic storage timeseries
              sum by(cluster, namespace) (cortex_ingester_memory_series)
              /
              max by(cluster, namespace) (cortex_distributor_replication_factor)
            )
            or
            ( # Ingest storage timeseries
              sum by(cluster, namespace) (
                max by(ingester_id, cluster, namespace) (
                  label_replace(cortex_ingester_memory_series,
                    "ingester_id", "$1",
                    "pod", ".*-([0-9]+)$"
                  )
                )
              )
            )
          ) > 100000
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 1h0m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirIngesterInstanceHasNoTenants
  trigger:
    interval: 1m
