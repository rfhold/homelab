apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-4a30293ad19d182a317ee9b3
spec:
  annotations:
    message: Mimir store-gateway in {{ $labels.cluster }}/{{ $labels.namespace }} is
      experiencing {{ $value | humanizePercentage }} errors while doing {{
      $labels.operation }} on the object storage.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirstoregatewaytoomanyfailedoperations
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum by(cluster, namespace, operation)
          (rate(thanos_objstore_bucket_operation_failures_total{component="store-gateway"}[1m]))
          > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirStoreGatewayTooManyFailedOperations
  trigger:
    interval: 1m
