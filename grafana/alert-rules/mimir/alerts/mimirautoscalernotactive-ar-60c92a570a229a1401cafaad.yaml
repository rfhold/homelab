apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-60c92a570a229a1401cafaad
spec:
  annotations:
    message: The Horizontal Pod Autoscaler (HPA) {{ $labels.horizontalpodautoscaler
      }} in {{ $labels.namespace }} is not active.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirautoscalernotactive
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (
              label_replace((
                kube_horizontalpodautoscaler_status_condition{condition="ScalingActive",status="false"}
                # Match only Mimir namespaces.
                * on(cluster, namespace) group_left max by(cluster, namespace) (cortex_build_info)
                # Add "metric" label.
                + on(cluster, namespace, horizontalpodautoscaler) group_right
                  # Using `max by ()` so that series churn doesn't break the promQL join
                  max by (cluster, namespace, horizontalpodautoscaler, metric) (
                    label_replace(kube_horizontalpodautoscaler_spec_target_metric*0, "metric", "$1", "metric_name", "(.+)")
                  )
                > 0),
                "scaledObject", "$1", "horizontalpodautoscaler", "keda-hpa-(?:mimir-)?(.*)"
              )
          )

          # Alert only if the scaling metric exists and is > 0. If the KEDA
          ScaledObject is configured to scale down 0,

          # then HPA ScalingActive may be false when expected to run 0 replicas.
          In this case, the scaling metric exported

          # by KEDA could not exist at all or being exposed with a value of 0.

          and on (cluster, namespace, metric, scaledObject) (
            max by (cluster, namespace, metric, scaledObject) (
              label_replace(keda_scaler_metrics_value, "namespace", "$0", "exported_namespace", ".+") > 0
            )
          )
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 1h0m0s
  labels:
    severity: critical
  noDataState: OK
  title: MimirAutoscalerNotActive
  trigger:
    interval: 1m
