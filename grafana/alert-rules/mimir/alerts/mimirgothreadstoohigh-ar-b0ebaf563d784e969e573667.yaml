apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-b0ebaf563d784e969e573667
spec:
  annotations:
    message: >
      Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace }}
      is running a very high number of Go threads.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirgothreadstoohigh
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          # We filter by the namespace because go_threads can be very high
          cardinality in a large organization.

          max by(cluster, namespace, pod) (go_threads{job=~".*(cortex|mimir).*"}
          > 5000)


          # Further filter on namespaces actually running Mimir.

          and on (cluster, namespace) (count by (cluster, namespace)
          (cortex_build_info))
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirGoThreadsTooHigh
  trigger:
    interval: 1m
