apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-0ff7d1a8844e6ef2b9420c40
spec:
  annotations:
    message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace
      }} fails to compact and upload blocks.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirblockbuildercompactanduploadfailed
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum by (cluster, namespace, pod)
          (rate(cortex_blockbuilder_tsdb_compact_and_upload_failed_total[1m])) >
          0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  labels:
    severity: critical
  noDataState: OK
  title: MimirBlockBuilderCompactAndUploadFailed
  trigger:
    interval: 1m
