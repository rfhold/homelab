apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-ab6d8809335624c2f4fe3b69
spec:
  annotations:
    message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace
      }} is stuck processing write requests from Kafka.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimiringesterstuckprocessingrecordsfromkafka
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          # Alert if the reader is not processing any records, but there
          buffered records to process in the Kafka client.

          (sum by (cluster, namespace, pod) (
              # This is the old metric name. We're keeping support for backward compatibility.
            rate(cortex_ingest_storage_reader_records_total[5m])
            or
            rate(cortex_ingest_storage_reader_requests_total[5m])
          ) == 0)

          and

          (sum by (cluster, namespace, pod)
          (cortex_ingest_storage_reader_buffered_fetched_records) > 0)
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: critical
  noDataState: OK
  title: MimirIngesterStuckProcessingRecordsFromKafka
  trigger:
    interval: 1m
