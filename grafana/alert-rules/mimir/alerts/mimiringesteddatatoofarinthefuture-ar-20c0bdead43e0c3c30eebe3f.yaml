apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-20c0bdead43e0c3c30eebe3f
spec:
  annotations:
    message: Mimir ingester {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} has ingested samples with timestamps more than 1h in
      the future.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimiringesteddatatoofarinthefuture
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          max by(cluster, namespace, pod) (
              cortex_ingester_tsdb_head_max_timestamp_seconds - time()
              and
              cortex_ingester_tsdb_head_max_timestamp_seconds > 0
          ) > 60*60
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirIngestedDataTooFarInTheFuture
  trigger:
    interval: 1m
