apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-98b51f33e37d8cfa4f02c5df
spec:
  annotations:
    message: >
      Alertmanager {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} is using too much memory.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimiralertmanagerallocatingtoomuchmemory
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (container_memory_working_set_bytes{container="alertmanager"} /
          container_spec_memory_limit_bytes{container="alertmanager"}) > 0.90

          and

          (container_spec_memory_limit_bytes{container="alertmanager"} > 0)
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: critical
  noDataState: OK
  title: MimirAlertmanagerAllocatingTooMuchMemory
  trigger:
    interval: 1m
