apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-1f13d8e01889ca784f765667
spec:
  annotations:
    message: >
      Mimir Ruler {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} is experiencing {{ printf "%.2f" $value }}% missed
      iterations for the rule group {{ $labels.rule_group }}.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirrulermissedevaluations
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          100 * (

          sum by (cluster, namespace, pod, rule_group)
          (rate(cortex_prometheus_rule_group_iterations_missed_total[1m]))
            /
          sum by (cluster, namespace, pod, rule_group)
          (rate(cortex_prometheus_rule_group_iterations_total[1m]))

          ) > 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirRulerMissedEvaluations
  trigger:
    interval: 1m
