apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-e49ee23e212453853e2ad3be
spec:
  annotations:
    message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} failed to run 2 consecutive compactions.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimircompactorhasnotsuccessfullyruncompaction
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: increase(cortex_compactor_runs_failed_total{reason!="shutdown"}[2h]) >= 2
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  labels:
    reason: consecutive-failures
    severity: critical
  noDataState: OK
  title: MimirCompactorHasNotSuccessfullyRunCompaction
  trigger:
    interval: 1m
