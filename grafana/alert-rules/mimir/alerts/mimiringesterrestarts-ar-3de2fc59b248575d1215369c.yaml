apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-3de2fc59b248575d1215369c
spec:
  annotations:
    message: Mimir {{ $labels.pod }} in {{ $labels.cluster }}/{{ $labels.namespace
      }} has restarted {{ printf "%.2f" $value }} times in the last 30 mins.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimiringesterrestarts
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (
            sum by(cluster, namespace, pod) (
              increase(kube_pod_container_status_restarts_total{container=~"(ingester)"}[30m])
            )
            >= 2
          )

          and

          (
            count by(cluster, namespace, pod) (cortex_build_info) > 0
          )
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  labels:
    severity: warning
  noDataState: OK
  title: MimirIngesterRestarts
  trigger:
    interval: 1m
