apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-da79988884eea4e18ad23ac6
spec:
  annotations:
    message: >
      Mimir Ruler {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} is experiencing {{ printf "%.2f" $value }}% write
      (push) errors.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirrulertoomanyfailedpushes
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          100 * (
          # Here it matches on empty "reason" for backwards compatibility, with when the metric didn't have this label.
          sum by (cluster, namespace, pod) (rate(cortex_ruler_write_requests_failed_total{reason=~"(error|^$)"}[1m]))
            /
          sum by (cluster, namespace, pod) (rate(cortex_ruler_write_requests_total[1m]))
          ) > 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: critical
  noDataState: OK
  title: MimirRulerTooManyFailedPushes
  trigger:
    interval: 1m
