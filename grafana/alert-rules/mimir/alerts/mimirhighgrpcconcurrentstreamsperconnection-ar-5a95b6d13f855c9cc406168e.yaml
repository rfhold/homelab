apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-5a95b6d13f855c9cc406168e
spec:
  annotations:
    message: >
      Container {{ $labels.container }} in {{ $labels.cluster }}/{{
      $labels.namespace }} is experiencing high GRPC concurrent streams per
      connection.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirhighgrpcconcurrentstreamsperconnection
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          max(avg_over_time(grpc_concurrent_streams_by_conn_max[10m])) by
          (cluster, namespace, container)

          /

          min(cortex_grpc_concurrent_streams_limit) by (cluster, namespace,
          container) > 0.9
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  labels:
    severity: warning
  noDataState: OK
  title: MimirHighGRPCConcurrentStreamsPerConnection
  trigger:
    interval: 1m
