apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-1722da8aa7593d7520085bb4
spec:
  annotations:
    message: Mimir gossip-ring service endpoints list in {{ $labels.cluster }}/{{
      $labels.namespace }} is out of sync.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirgossipmembersendpointsoutofsync
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          (
            count by(cluster, namespace) (
              kube_endpoint_address{endpoint="gossip-ring"}
              unless on (cluster, namespace, ip)
              label_replace(kube_pod_info, "ip", "$1", "pod_ip", "(.*)"))
            /
            count by(cluster, namespace) (
              kube_endpoint_address{endpoint="gossip-ring"}
            )
            * 100 > 10
          )

          # Filter by Mimir only.
          and (count by(cluster, namespace) (cortex_build_info) > 0)
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 15m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirGossipMembersEndpointsOutOfSync
  trigger:
    interval: 1m
