apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-cc10ee86767f22aa6cd99671
spec:
  annotations:
    message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} has run out of disk space.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimircompactorhasrunoutofdiskspace
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: increase(cortex_compactor_disk_out_of_space_errors_total{}[24h]) >= 1
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  labels:
    reason: non-transient
    severity: critical
  noDataState: OK
  title: MimirCompactorHasRunOutOfDiskSpace
  trigger:
    interval: 1m
