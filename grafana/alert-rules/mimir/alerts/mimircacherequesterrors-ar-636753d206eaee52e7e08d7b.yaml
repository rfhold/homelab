apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-636753d206eaee52e7e08d7b
spec:
  annotations:
    message: >
      The cache {{ $labels.name }} used by Mimir {{ $labels.cluster }}/{{
      $labels.namespace }} is experiencing {{ printf "%.2f" $value }}% errors
      for {{ $labels.operation }} operation.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimircacherequesterrors
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          (
            sum by(cluster, namespace, name, operation) (
              rate(thanos_cache_operation_failures_total{operation!~"add|delete"}[1m])
            )
            /
            sum by(cluster, namespace, name, operation) (
              rate(thanos_cache_operations_total{operation!~"add|delete"}[1m])
            ) > 10
          ) * 100 > 5
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 5m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirCacheRequestErrors
  trigger:
    interval: 1m
