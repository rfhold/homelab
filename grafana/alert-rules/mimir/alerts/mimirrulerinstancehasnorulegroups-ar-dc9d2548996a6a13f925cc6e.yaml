apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-dc9d2548996a6a13f925cc6e
spec:
  annotations:
    message: Mimir ruler {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} has no rule groups assigned.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirrulerinstancehasnorulegroups
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          # Alert on ruler instances in microservices mode that have no rule
          groups assigned,

          min by(cluster, namespace, pod)
          (cortex_ruler_managers_total{pod=~"(.*mimir-)?ruler.*"}) == 0

          # but only if other ruler instances of the same cell do have rule
          groups assigned

          and on (cluster, namespace)

          (max by(cluster, namespace) (cortex_ruler_managers_total) > 0)

          # and there are more than two instances overall

          and on (cluster, namespace)

          (count by (cluster, namespace) (cortex_ruler_managers_total) > 2)
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 1h0m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirRulerInstanceHasNoRuleGroups
  trigger:
    interval: 1m
