apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-d84507e0d326dbf0af891f92
spec:
  annotations:
    message: Mimir Compactor {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} is failing to build sparse index headers
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimircompactorfailingtobuildsparseindexheaders
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: (sum by(cluster, namespace, pod)
          (increase(cortex_compactor_build_sparse_headers_failures_total[5m])) >
          0)
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 30m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirCompactorFailingToBuildSparseIndexHeaders
  trigger:
    interval: 1m
