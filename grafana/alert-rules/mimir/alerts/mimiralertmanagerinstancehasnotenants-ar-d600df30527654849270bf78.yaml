apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-d600df30527654849270bf78
spec:
  annotations:
    message: Mimir alertmanager {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} owns no tenants.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimiralertmanagerinstancehasnotenants
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          # Alert on alertmanager instances in microservices mode that own no
          tenants,

          min by(cluster, namespace, pod)
          (cortex_alertmanager_tenants_owned{pod=~"(.*mimir-)?alertmanager.*"})
          == 0

          # but only if other instances of the same cell do have tenants
          assigned.

          and on (cluster, namespace)

          max by(cluster, namespace) (cortex_alertmanager_tenants_owned) > 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 1h0m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirAlertmanagerInstanceHasNoTenants
  trigger:
    interval: 1m
