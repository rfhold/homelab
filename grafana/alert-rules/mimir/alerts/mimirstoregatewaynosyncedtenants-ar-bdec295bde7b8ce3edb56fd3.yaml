apiVersion: rules.alerting.grafana.app/v0alpha1
kind: AlertRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: ar-bdec295bde7b8ce3edb56fd3
spec:
  annotations:
    message: Mimir store-gateway {{ $labels.pod }} in {{ $labels.cluster }}/{{
      $labels.namespace }} is not syncing any blocks for any tenant.
    runbook_url: https://grafana.com/docs/mimir/latest/operators-guide/mimir-runbooks/#mimirstoregatewaynosyncedtenants
  execErrState: Error
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: min by(cluster, namespace, pod)
          (cortex_bucket_stores_tenants_synced{component="store-gateway"}) == 0
        instant: false
        intervalMs: 1000
        maxDataPoints: 43200
        range: true
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
    B:
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        reducer: last
        settings:
          mode: dropNN
        type: reduce
      source: true
  for: 1h0m0s
  labels:
    severity: warning
  noDataState: OK
  title: MimirStoreGatewayNoSyncedTenants
  trigger:
    interval: 1m
