apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-ed6b1a08022fb2f7a46ffb1d
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum(rate(cortex_ingester_queried_samples_sum[1m])) by (cluster, job) /
          sum(rate(cortex_ingester_queried_samples_count[1m])) by (cluster, job)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_job:cortex_ingester_queried_samples:avg
  targetDatasourceUID: mimir
  title: cluster_job:cortex_ingester_queried_samples:avg
  trigger:
    interval: 1m
