apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-b08dbc8d1ce3b46dcd96ce1f
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum(rate(cortex_kv_request_duration_seconds_sum[1m])) by (cluster, job) /
          sum(rate(cortex_kv_request_duration_seconds_count[1m])) by (cluster,
          job)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_job:cortex_kv_request_duration_seconds:avg
  targetDatasourceUID: mimir
  title: cluster_job:cortex_kv_request_duration_seconds:avg
  trigger:
    interval: 1m
