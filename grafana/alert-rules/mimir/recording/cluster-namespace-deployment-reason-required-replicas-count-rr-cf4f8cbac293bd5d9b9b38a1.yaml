apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-cf4f8cbac293bd5d9b9b38a1
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          ceil(
            (sum by (cluster, namespace) (
              cortex_ingester_tsdb_storage_blocks_bytes{job=~".+/ingester.*"}
            ) / 4)
              /
            avg by (cluster, namespace) (
              memcached_limit_bytes{job=~".+/memcached"}
            )
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    deployment: memcached
    reason: active_series
  metric: cluster_namespace_deployment_reason:required_replicas:count
  targetDatasourceUID: mimir
  title: cluster_namespace_deployment_reason:required_replicas:count
  trigger:
    interval: 1m
