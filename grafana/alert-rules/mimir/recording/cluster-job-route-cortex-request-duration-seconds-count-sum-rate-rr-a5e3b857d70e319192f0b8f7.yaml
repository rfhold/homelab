apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-a5e3b857d70e319192f0b8f7
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum(rate(cortex_request_duration_seconds_count[1m])) by (cluster, job,
          route)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_job_route:cortex_request_duration_seconds_count:sum_rate
  targetDatasourceUID: mimir
  title: cluster_job_route:cortex_request_duration_seconds_count:sum_rate
  trigger:
    interval: 1m
