apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-dba3f0f00dfc32eca0c75eee
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum(rate(cortex_kv_request_duration_seconds_sum[1m])) by (cluster, job)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_job:cortex_kv_request_duration_seconds_sum:sum_rate
  targetDatasourceUID: mimir
  title: cluster_job:cortex_kv_request_duration_seconds_sum:sum_rate
  trigger:
    interval: 1m
