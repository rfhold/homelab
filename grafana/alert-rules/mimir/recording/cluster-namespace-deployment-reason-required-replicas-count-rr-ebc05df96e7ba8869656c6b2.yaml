apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-ebc05df96e7ba8869656c6b2
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          ceil(
            quantile_over_time(0.99,
              sum by(cluster, namespace) (
                cortex_ingester_memory_series
              )[24h:]
            )
            / 1500000
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    deployment: ingester
    reason: active_series
  metric: cluster_namespace_deployment_reason:required_replicas:count
  targetDatasourceUID: mimir
  title: cluster_namespace_deployment_reason:required_replicas:count
  trigger:
    interval: 1m
