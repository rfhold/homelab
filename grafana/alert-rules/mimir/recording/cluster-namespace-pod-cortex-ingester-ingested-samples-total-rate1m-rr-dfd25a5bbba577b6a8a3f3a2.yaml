apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-dfd25a5bbba577b6a8a3f3a2
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: sum by(cluster, namespace, pod)
          (rate(cortex_ingester_ingested_samples_total[1m]))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_namespace_pod:cortex_ingester_ingested_samples_total:rate1m
  targetDatasourceUID: mimir
  title: cluster_namespace_pod:cortex_ingester_ingested_samples_total:rate1m
  trigger:
    interval: 1m
