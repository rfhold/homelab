        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_job_route:cortex_querier_request_duration_seconds:99quantile
  targetDatasourceUID: mimir
  title: cluster_job_route:cortex_querier_request_duration_seconds:99quantile
  trigger:
    interval: 1m
