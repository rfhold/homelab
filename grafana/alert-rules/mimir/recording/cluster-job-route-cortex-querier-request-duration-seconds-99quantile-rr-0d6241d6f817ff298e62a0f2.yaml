apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-0d6241d6f817ff298e62a0f2
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: histogram_quantile(0.99,
          sum(rate(cortex_querier_request_duration_seconds_bucket[1m])) by (le,
          cluster, job, route))
