apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-987813c5ed2b8c275b0c3474
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          # Convenience rule to get the Memory utilization for both a deployment
          and a statefulset.

          # Multi-zone deployments are grouped together removing the "zone-X"
          suffix.

          sum by (cluster, namespace, deployment) (
            label_replace(
              label_replace(
                container_memory_usage_bytes{image!=""},
                "deployment", "$1", "pod", "(.*)-(?:([0-9]+)|([a-z0-9]+)-([a-z0-9]+))"
              ),
              # The question mark in "(.*?)" is used to make it non-greedy, otherwise it
              # always matches everything and the (optional) zone is not removed.
              "deployment", "$1", "deployment", "(.*?)(?:-zone-[a-z])?"
            )
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_namespace_deployment:container_memory_usage_bytes:sum
  targetDatasourceUID: mimir
  title: cluster_namespace_deployment:container_memory_usage_bytes:sum
  trigger:
    interval: 1m
