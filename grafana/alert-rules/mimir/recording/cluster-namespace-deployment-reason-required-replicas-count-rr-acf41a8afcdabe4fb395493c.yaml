apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-acf41a8afcdabe4fb395493c
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          ceil(
            sum by (cluster, namespace) (cortex_limits_overrides{limit_name="max_global_series_per_user"})
            * 3 * 0.59999999999999998 / 1500000
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    deployment: ingester
    reason: active_series_limits
  metric: cluster_namespace_deployment_reason:required_replicas:count
  targetDatasourceUID: mimir
  title: cluster_namespace_deployment_reason:required_replicas:count
  trigger:
    interval: 1m
