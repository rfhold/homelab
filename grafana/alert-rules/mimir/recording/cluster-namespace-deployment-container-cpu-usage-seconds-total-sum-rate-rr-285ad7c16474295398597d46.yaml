apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-285ad7c16474295398597d46
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: >-
          sum by (cluster, namespace, deployment) (
            label_replace(
              label_replace(
                sum by (cluster, namespace, pod)(rate(container_cpu_usage_seconds_total[1m])),
                "deployment", "$1", "pod", "(.*)-(?:([0-9]+)|([a-z0-9]+)-([a-z0-9]+))"
              ),
              # The question mark in "(.*?)" is used to make it non-greedy, otherwise it
              # always matches everything and the (optional) zone is not removed.
              "deployment", "$1", "deployment", "(.*?)(?:-zone-[a-z])?"
            )
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  metric: cluster_namespace_deployment:container_cpu_usage_seconds_total:sum_rate
  targetDatasourceUID: mimir
  title: cluster_namespace_deployment:container_cpu_usage_seconds_total:sum_rate
  trigger:
    interval: 1m
