apiVersion: rules.alerting.grafana.app/v0alpha1
kind: RecordingRule
metadata:
  annotations:
    grafana.app/folder: alert-rules-mimir
    grafana.com/provenance: converted_prometheus
  labels:
    grafana.app/folder: alert-rules-mimir
  name: rr-77d43b3c0e0aea5bd1d7de71
spec:
  expressions:
    A:
      datasourceUID: mimir
      model:
        datasource:
          type: prometheus
          uid: mimir
        expr: |-
          ceil(
            quantile_over_time(0.99,
              sum by (cluster, namespace) (
                cluster_namespace_job:cortex_distributor_received_samples:rate5m
              )[24h:]
            )
            * 3 / 80000
          )
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        range: false
        refId: A
      relativeTimeRange:
        from: 10m0s
        to: 0s
      source: true
  labels:
    deployment: ingester
    reason: sample_rate
  metric: cluster_namespace_deployment_reason:required_replicas:count
  targetDatasourceUID: mimir
  title: cluster_namespace_deployment_reason:required_replicas:count
  trigger:
    interval: 1m
