config:
  kubernetes:enableConfigMapMutable: "true"
  kubernetes:clusterIdentifier: pantheon
  kubernetes:context: pantheon
  agent-gateway:workloadLabels:
    agent-gateway:
      app.kubernetes.io/name: agent-gateway
      app.kubernetes.io/instance: agent-gateway
      app.kubernetes.io/component: llm-gateway
      app.kubernetes.io/part-of: agent-gateway
      app.kubernetes.io/managed-by: pulumi
      rholden.dev/workload-layer: application
    agent-gateway-postgres:
      app.kubernetes.io/name: agent-gateway-postgres
      app.kubernetes.io/instance: agent-gateway-postgres
      app.kubernetes.io/component: database
      app.kubernetes.io/part-of: agent-gateway
      app.kubernetes.io/managed-by: pulumi
      rholden.dev/workload-layer: data
  agent-gateway:namespace: agentgateway-system
  agent-gateway:hostname: agent-gateway.holdenitdown.net
  agent-gateway:routeStorageMode: database
  agent-gateway:routingRepresentationMode: first-class
  agent-gateway:virtualModels:
    - name: local-embedding
      targets:
        - model: local-embedding-athena
          priority: 0
        - model: local-embedding-vulkan
          priority: 0
    - name: local-small
      retainConcreteAlias: true
      targets:
        - model: local-small-mars
          priority: 0
        - model: local-small-vulkan
          priority: 0
  agent-gateway:requestRetry:
    attempts: 1
    codes: [500, 502, 503, 504]
    backoff: 100ms
    precondition: 'request.method == "POST" && request.path == "/v1/embeddings" && "x-model" in request.headers && request.headers["x-model"] == "local-embedding"'
  agent-gateway:modelExtractionExclusionPaths:
    - /v1/audio/transcriptions
    - /v1/audio/speech
  agent-gateway:providers:
    - name: openai
      envVar: OPENAI_API_KEY
      provider:
        openai: {}
      policies:
        ai:
          routes:
            /v1/responses: Responses
            /v1/chat/completions: Completions
            /v1/models: Models
            "*": Passthrough
          modelPrefix: openai/
    - name: anthropic
      envVar: ANTHROPIC_API_KEY
      provider:
        anthropic: {}
      policies:
        ai:
          routes:
            /v1/messages: Messages
            /v1/models: Models
            "*": Passthrough
          modelPrefix: anthropic/
    - name: claude
      provider:
        host: claude-proxy.claude-proxy.svc.cluster.local
        port: 8080
        anthropic: {}
      policies:
        ai:
          routes:
            /v1/messages: Messages
            /v1/models: Models
            "*": Passthrough
          modelPrefix: claude/
    - name: chutes
      upstreamFormats: [completions]
      envVar: CHUTES_API_KEY
      provider:
        host: llm.chutes.ai
        port: 443
        openai: {}
      policies:
        tls:
          sni: llm.chutes.ai
        ai:
          routes:
            /v1/chat/completions: Completions
            /v1/models: Models
            "*": Passthrough
          modelAliases:
            chutes/moonshotai/Kimi-K2-Instruct-0905: moonshotai/Kimi-K2-Instruct-0905
            chutes/moonshotai/Kimi-K2-Thinking-TEE: moonshotai/Kimi-K2-Thinking-TEE
            chutes/moonshotai/Kimi-K2.5-TEE: moonshotai/Kimi-K2.5-TEE
            chutes/Qwen/Qwen3-235B-A22B-Instruct-2507-TEE: Qwen/Qwen3-235B-A22B-Instruct-2507-TEE
            chutes/Qwen/Qwen3-Coder-Next-TEE: Qwen/Qwen3-Coder-Next-TEE
            chutes/zai-org/GLM-5-TEE: zai-org/GLM-5-TEE
            chutes/Qwen/Qwen3.5-397B-A17B-TEE: Qwen/Qwen3.5-397B-A17B-TEE
    - name: codex
      upstreamFormats: [responses, completions]
      provider:
        host: codex-proxy.codex-proxy.svc.cluster.local
        port: 8080
        openai: {}
      policies:
        ai:
          routes:
            /v1/responses: Responses
            /v1/chat/completions: Completions
            /v1/models: Models
            "*": Passthrough
          modelPrefix: codex/
          modelAliases:
            dreamer: gpt-6-astra
            workhorse: gpt-6.1-sol
            turbo: gpt-6-luna
    - name: cerebras
      upstreamFormats: [completions]
      envVar: CEREBRAS_API_KEY
      provider:
        host: api.cerebras.ai
        port: 443
        openai: {}
      policies:
        tls:
          sni: api.cerebras.ai
        ai:
          routes:
            /v1/chat/completions: Completions
            /v1/models: Models
            "*": Passthrough
          modelAliases:
            cerebras/zai-org/zai-glm-4.7: zai-glm-4.7
    - name: bifrost
      provider:
        host: gateway.skysquid.net
        port: 443
        openai: {}
      policies:
        tls:
          sni: gateway.skysquid.net
        ai:
          routes:
            /openai/v1/chat/completions: Completions
            "*": Passthrough
          modelPrefix: bifrost/
    - name: vllm-local-embedding
      upstreamFormats: [embeddings]
      modelSettings:
        local-embedding-athena:
          visibility: internal
          health:
            eviction:
              consecutiveFailures: 1
              duration: 30s
      provider:
        host: qwen3-embedding.vllm.svc.cluster.local
        port: 8000
        openai: {}
      policies:
        ai:
          routes:
            /v1/embeddings: Embeddings
            /v1/models: Models
            "*": Passthrough
          modelAliases:
            local-embedding-athena: Qwen/Qwen3-Embedding-0.6B
    - name: vllm-vulkan-embedding
      upstreamFormats: [embeddings]
      provider:
        host: vulkan.holdenitdown.net
        port: 8001
        openai: {}
      modelSettings:
        local-embedding-vulkan:
          visibility: internal
          health:
            eviction:
              consecutiveFailures: 1
              duration: 30s
      policies:
        ai:
          routes:
            /v1/embeddings: Embeddings
            /v1/models: Models
            "*": Passthrough
          modelAliases:
            local-embedding-vulkan: Qwen/Qwen3-Embedding-0.6B
    - name: llama-cpp-local-small
      upstreamFormats: [completions]
      modelSettings:
        local-small-mars:
          visibility: internal
          health:
            eviction:
              consecutiveFailures: 1
              duration: 30s
      provider:
        host: qwen3-8-27b-llama-cpp.llama-cpp.svc.cluster.local
        port: 8000
        openai: {}
      policies:
        ai:
          routes:
            /v1/chat/completions: Completions
            /v1/models: Models
            "*": Passthrough
          modelAliases:
            local-small: qwen3.5-9b-hauhaucs-aggressive
            local-small-mars: qwen3.5-9b-hauhaucs-aggressive
    - name: llama-cpp-vulkan-small
      upstreamFormats: [completions]
      provider:
        host: vulkan.holdenitdown.net
        port: 8002
        openai: {}
      modelSettings:
        local-small-vulkan:
          visibility: internal
          health:
            eviction:
              consecutiveFailures: 1
              duration: 30s
      policies:
        ai:
          routes:
            /v1/chat/completions: Completions
            /v1/models: Models
            "*": Passthrough
          modelAliases:
            local-small-vulkan: qwen3.5-9b-hauhaucs-aggressive
    - name: llama-cpp-vulkan
      upstreamFormats: [completions]
      provider:
        host: vulkan.holdenitdown.net
        port: 8000
        openai: {}
      policies:
        ai:
          routes:
            /v1/chat/completions: Completions
            /v1/models: Models
            "*": Passthrough
          modelAliases:
            local-medium: flint
