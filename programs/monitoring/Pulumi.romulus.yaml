config:
  kubernetes:clusterIdentifier: romulus
  kubernetes:context: romulus
  monitoring:workloadLabels:
    k8s-monitoring: &monitoringLabels
      app.kubernetes.io/part-of: observability
      app.kubernetes.io/managed-by: pulumi
      rholden.dev/workload-layer: observability
    mktxp: *monitoringLabels
    dcgm-exporter: *monitoringLabels
  monitoring:telemetryEndpoint: telemetry.holdenitdown.net
  monitoring:clusterName: romulus
  monitoring:tlsIngressProbes:
    enabled: true
    publicDomainRegex: '^([a-z0-9-]+\.)*(holdenitdown\.net|rholden\.dev|rholden\.me)$'
  monitoring:annotationAutodiscovery:
    enabled: true
    scrapeInterval: 60s
    scrapeTimeout: 10s
    pods:
      enabled: true
    services:
      enabled: true
  monitoring:prometheusOperatorObjects:
    enabled: true
    crds:
      deploy: true
    serviceMonitors:
      enabled: true
      scrapeInterval: 60s
    podMonitors:
      enabled: true
      scrapeInterval: 60s
    probes:
      enabled: true
      scrapeInterval: 60s
  monitoring:mktxp:
    enabled: true
    nodeSelector:
      kubernetes.io/hostname: luna
    routers:
      - name: ccr-2004
        hostname: "192.168.99.1"
        username: mktxp
        port: 8728
        poe: false
      - name: crs-320
        hostname: "192.168.99.2"
        username: mktxp
        port: 8728
      - name: crs-310
        hostname: "192.168.99.3"
        username: mktxp
        port: 8728
        poe: false
      - name: crs-312
        hostname: "192.168.99.5"
        username: mktxp
        port: 8728
        poe: false
      - name: crs-309
        hostname: "192.168.99.7"
        username: mktxp
        port: 8728
        poe: false
  monitoring:alloyMetricsResources:
    requests:
      memory: 512Mi
      cpu: 100m
    limits:
      memory: 2Gi
      cpu: 1000m
  monitoring:alloyLogsResources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: 500m
  monitoring:alloyLogsExtraVolumes:
    - name: varlog-hdd
      hostPath:
        path: /var/log.hdd
        type: DirectoryOrCreate
  monitoring:alloyLogsExtraMounts:
    - name: varlog-hdd
      mountPath: /var/log.hdd
      readOnly: true
  monitoring:mktxp.router.ccr-2004.password:
    secure: v1:rmJsH2zR7yPAiGp6:HGWTSieBCQvRUeL362as4TT/onqG17UOIxh4eETg5Zomdtm6gWR9EQME8YfdnK+Oouic/VN7vv2Z
