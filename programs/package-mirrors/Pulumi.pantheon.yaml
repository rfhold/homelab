config:
  kubernetes:context: pantheon
  package-mirrors:workloadLabels:
    athens: &packageMirrorLabels
      app.kubernetes.io/part-of: package-mirrors
      app.kubernetes.io/managed-by: pulumi
      rholden.dev/workload-layer: application
    verdaccio: *packageMirrorLabels
    kellnr: *packageMirrorLabels
    apt-proxy: *packageMirrorLabels
    pacoloco: *packageMirrorLabels
    apk-proxy: *packageMirrorLabels
  package-mirrors:gatewayRef:
    name: default-gateway
    namespace: ingress
  package-mirrors:hostname: mirrors.holdenitdown.net
  package-mirrors:aptHostname: apt-mirrors.holdenitdown.net
  package-mirrors:bucketStorageClass: default-bucket
  package-mirrors:kellnr:
    dbStorage:
      size: 5Gi
      storageClass: shared-fs
  package-mirrors:aptProxy:
    storage:
      size: 100Gi
      storageClass: shared-fs
  package-mirrors:pacoloco:
    storage:
      size: 200Gi
      storageClass: shared-fs
    repos:
      archlinux:
        urls:
          - https://geo.mirror.pkgbuild.com
          - https://mirrors.kernel.org/archlinux
  package-mirrors:apkProxy:
    storage:
      size: 50Gi
      storageClass: shared-fs
