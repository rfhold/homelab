  kubernetes:context: pantheon
  nats:storage-size: "20Gi"
  nats:storage-class: "shared-fs"
  nats:cpu: "500m"
  nats:memory: "2Gi"
  nats:mem-storage-size: "1Gi"
  nats:replicas: "3"
