config:
  kubernetes:clusterIdentifier: pantheon
  kubernetes:context: pantheon
  container-registry:namespace: container-registry

  container-registry:private-registry:
    enabled: false
    objectStoreStack: organization/object-storage/pantheon
    objectStoreName: default
    bucket: container-registry
    user: registry
    region: us-east-1
    rootDirectory: /registry

  container-registry:zot-registry:
    enabled: true
    objectStoreStack: organization/object-storage/pantheon
    objectStoreName: default
    bucket: container-registry
    user: registry
    region: us-east-1
    rootDirectory: /zot
    serviceType: LoadBalancer
    serviceAnnotations:
      metallb.universe.tf/address-pool: default-pool
      external-dns.alpha.kubernetes.io/hostname: cr.holdenitdown.net
    tls:
      secretName: container-registry-private-tls
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 1000m

  container-registry:proxy-registries: []

