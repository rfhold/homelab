config:
  kubernetes:clusterIdentifier: romulus
  kubernetes:context: romulus
  dns:workloadLabels:
    dns:
      app.kubernetes.io/name: technitium-dns
      app.kubernetes.io/instance: dns
      app.kubernetes.io/component: dns-server
      app.kubernetes.io/part-of: dns
      app.kubernetes.io/managed-by: pulumi
      rholden.dev/workload-layer: platform
  dns:zones:
    - name: holdenitdown.net
    - name: rholden.dev
    - name: rholden.me
  dns:technitiumDns:
    forwarders: "1.0.0.1,8.8.8.8"
    nodeSelector:
      rholden.dev/vlan-access: "4"
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/address-pool: dns-pool
      externalTrafficPolicy: Local
      ports:
        dns: 53
        dnsUdp: 53
        webUi: 5380
        cluster: 53443
    storage:
      size: "5Gi"
    resources:
      requests:
        memory: "512Mi"
        cpu: "200m"
      limits:
        memory: "2Gi"
        cpu: "2000m"
  dns:dnssecValidation: "false"
  dns:dnsServerDomain: primary.dns.holdenitdown.net
  dns:cluster:
    clusterDomain: dns.holdenitdown.net
    nodeIpAddresses: "172.16.4.8"
  dns:blocklists:
    - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.txt
    - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.txt
  dns:adminPassword:
    secure: v1:GzqNFIZpphr0M29L:J3Kkplp2YVOVnqb1H57Cx1SIcNXxKfUEadB6VMFmWdn+Qlz/dyBoEdUzlZ8coPT8
