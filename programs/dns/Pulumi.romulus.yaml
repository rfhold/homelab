config:
  kubernetes:clusterIdentifier: romulus
  kubernetes:context: romulus
  dns:zones:
    - name: holdenitdown.net
    - name: rholden.dev
    - name: rholden.me
  dns:technitiumDns:
    forwarders: "172.16.4.1"
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/address-pool: dns-pool
      externalTrafficPolicy: Local
      ports:
        dns: 53
        dnsUdp: 53
        webUi: 5380
        cluster: 53443
    storage:
      size: "5Gi"
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
  dns:dnssecValidation: "false"
  dns:dnsServerDomain: primary.dns.holdenitdown.net
  dns:cluster:
    clusterDomain: dns.holdenitdown.net
    nodeIpAddresses: "172.16.4.8"
  dns:blocklists:
