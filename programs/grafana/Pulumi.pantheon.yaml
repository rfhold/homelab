config:
  kubernetes:clusterIdentifier: pantheon
  kubernetes:context: pantheon
  grafana:workloadLabels:
    grafana-stack:
      app.kubernetes.io/name: grafana-stack
      app.kubernetes.io/instance: grafana-stack
      app.kubernetes.io/component: observability
      app.kubernetes.io/part-of: observability
      app.kubernetes.io/managed-by: pulumi
      rholden.dev/workload-layer: observability
  grafana:ingress:
    enabled: true
    className: "internal"
    host: "grafana.holdenitdown.net"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    tls:
      enabled: true
      secretName: "grafana-tls"
  grafana:resources:
    requests:
      memory: "256Mi"
      cpu: "500m"
    limits:
      memory: "512Mi"
      cpu: "1500m"
  grafana:objectStorage:
    cluster: "default"
    storageClassName: "default-bucket"
    endpoint: "https://s3.pantheon.holdenitdown.net"
    userNamespace: "storage"
  grafana:replicas: 2
  grafana:mimir:
    prometheusHostname: "prometheus.holdenitdown.net"
    gatewayName: "default-gateway"
    gatewayNamespace: "ingress"
    limits:
      ingestionRate: 50000
      ingestionBurstSize: 1000000
      maxGlobalSeriesPerUser: 750000
    resources:
      storeGateway:
        requests:
          memory: "4Gi"
  grafana:database:
    instances: 3
    storage:
      size: "50Gi"
      storageClass: "shared-fs"
  grafana:adminUser: "admin"
  grafana:kubernetesMixinVersion: "1.3.1"
  grafana:alloy:
    enabled: true
    hostname: "telemetry.holdenitdown.net"
    clusterIssuer: "letsencrypt-prod"
    faroHostname: "faro.holdenitdown.net"
    serviceAnnotations:
      external-dns.alpha.kubernetes.io/hostname: "telemetry.holdenitdown.net"
      metallb.io/address-pool: default-pool
    resources:
      requests:
        memory: 512Mi
        cpu: 100m
      limits:
        memory: 2Gi
        cpu: 1000m
  grafana:imageRenderer:
    enabled: true
    resources:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 16Gi
  grafana:observabilityKafka:
    enabled: true
    nodePoolName: "database"
    replicas: 3
    storage:
      size: "100Gi"
      class: "database"
    resources:
      requests:
        cpu: "500m"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    jvmOptions:
      xms: "1024M"
      xmx: "1024M"
    quorumTimeouts:
      electionMs: 10000
      fetchMs: 30000
      brokerSessionMs: 30000
    metrics:
      enabled: true
