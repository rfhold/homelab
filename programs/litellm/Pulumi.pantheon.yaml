config:
  kubernetes:context: pantheon
  litellm:namespace: litellm
  litellm:replicas: "1"
  litellm:httpRoute:
    enabled: true
    hostname: litellm.holdenitdown.net
    gatewayRef:
      name: default-gateway
      namespace: ingress
    requestTimeout: 600s
  litellm:metrics:
    enabled: true
    scrapeInterval: 30s
  litellm:providers:
    openai:
      models:
        - name: openai/gpt-5-mini
          litellmModel: openai/gpt-5-mini
        - name: openai/gpt-5.2
          litellmModel: openai/gpt-5.2
    anthropic:
      models:
        - name: anthropic/claude-haiku-4-5
          litellmModel: anthropic/claude-haiku-4-5
        - name: anthropic/claude-sonnet-4-5
          litellmModel: anthropic/claude-sonnet-4-5
        - name: anthropic/claude-sonnet-4-6
          litellmModel: anthropic/claude-sonnet-4-6
        - name: anthropic/claude-opus-4-5
          litellmModel: anthropic/claude-opus-4-5
    cerebras:
      apiBase: https://api.cerebras.ai/v1
      models:
        - name: cerebras/zai-org/zai-glm-4.7
          litellmModel: cerebras/zai-glm-4.7
    chutes:
      apiBase: https://llm.chutes.ai/v1
      models:
        - name: chutes/moonshotai/kimi-k2-instruct-0905
          litellmModel: openai/moonshotai/Kimi-K2-Instruct-0905
        - name: chutes/moonshotai/kimi-k2-thinking
          litellmModel: openai/moonshotai/Kimi-K2-Thinking-TEE
        - name: chutes/moonshotai/kimi-k2.5
          litellmModel: openai/moonshotai/Kimi-K2.5-TEE
        - name: chutes/qwen/qwen3-235b-a22b-instruct-2507
          litellmModel: openai/Qwen/Qwen3-235B-A22B-Instruct-2507-TEE
        - name: chutes/qwen/qwen3-coder-next
          litellmModel: openai/Qwen/Qwen3-Coder-Next-TEE
        - name: chutes/zai-org/glm-5
          litellmModel: openai/zai-org/GLM-5-TEE
        - name: chutes/qwen/qwen3.5-397b-a17b
          litellmModel: openai/Qwen/Qwen3.5-397B-A17B-TEE
  litellm:vllm:
    - name: vllm/zai-org/glm-4.7-flash
      apiBase: http://ai-inference-glm-4-7-flash.ai-inference.svc.cluster.local:8000/v1
      model: zai-org/GLM-4.7-Flash
    - name: vllm/qwen/qwen3-embedding-8b
      apiBase: http://ai-inference-qwen3-embedding-8b.ai-inference.svc.cluster.local:8000/v1
      model: Qwen/Qwen3-Embedding-8B
