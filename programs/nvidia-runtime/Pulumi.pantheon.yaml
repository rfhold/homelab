config:
  kubernetes:clusterIdentifier: pantheon
  kubernetes:context: pantheon
  nvidia-runtime:workloadLabels:
    nvidia-device-plugin:
      app.kubernetes.io/name: nvidia-device-plugin
      app.kubernetes.io/instance: nvidia-device-plugin
      app.kubernetes.io/component: device-plugin
      app.kubernetes.io/part-of: nvidia-runtime
      app.kubernetes.io/managed-by: pulumi
      rholden.dev/workload-layer: platform
  nvidia-runtime:device-plugin:
    tolerations:
      - key: "workload-type"
        value: "gpu-inference"
        effect: "NoSchedule"
    nodeSelector:
      rholden.dev/gpu: "cuda"
