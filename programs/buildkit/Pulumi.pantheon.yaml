config:
  kubernetes:clusterIdentifier: pantheon
  kubernetes:context: pantheon
  buildkit:amd64:
    nodeSelector:
      kubernetes.io/hostname: vulkan
    tolerations:
      - key: "workload-type"
        operator: "Equal"
        value: "gpu-inference"
        effect: "NoSchedule"
    hostPath: "/var/lib/buildkit-cache/amd64"
    resources:
      requests:
        memory: "2Gi"
        cpu: "1000m"
      limits:
        memory: "16Gi"
        cpu: "12000m"
  buildkit:arm64:
    nodeSelector:
      kubernetes.io/hostname: mars
    tolerations:
      - key: "workload-type"
        operator: "Equal"
        value: "gpu-inference"
        effect: "NoSchedule"
    hostPath: "/var/lib/buildkit-cache/arm64"
    resources:
      requests:
        memory: "4Gi"
        cpu: "500m"
      limits:
        memory: "32Gi"
        cpu: "32000m"
