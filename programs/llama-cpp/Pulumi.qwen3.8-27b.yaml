config:
  kubernetes:clusterIdentifier: pantheon
  kubernetes:context: pantheon
  llama-cpp:config:
    name: qwen3-8-27b-llama-cpp
    namespace: llama-cpp
    createNamespace: false
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10630
    model:
