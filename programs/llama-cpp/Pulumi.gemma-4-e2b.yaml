config:
  kubernetes:clusterIdentifier: pantheon
  kubernetes:context: pantheon
  llama-cpp:config:
    name: gemma-4-e2b
    namespace: llama-cpp
    model:
      name: gemma-4-e2b
      huggingFaceRepo: unsloth/gemma-4-E2B-it-GGUF
      huggingFaceFile: gemma-4-E2B-it-Q6_K.gguf
    inference:
      contextSize: 131072
      gpuLayers: 999
      parallel: 1
      extraArgs:
        - --temp
        - "1.0"
        - --top-p
        - "0.95"
        - --top-k
        - "64"
    runtimeClassName: nvidia
    replicas: 1
    resources:
      requests:
        memory: 8Gi
        cpu: "2000m"
        nvidia.com/gpu: "1"
      limits:
        memory: 16Gi
        cpu: "6000m"
        nvidia.com/gpu: "1"
    tolerations:
      - key: workload-type
        operator: Equal
        value: gpu-inference
        effect: NoSchedule
    nodeSelector:
      kubernetes.io/hostname: athena
      rholden.dev/gpu: cuda
    modelCache:
      size: 200Gi
      nfs:
        server: mars.holdenitdown.net
        path: /export/models
        readOnly: false
