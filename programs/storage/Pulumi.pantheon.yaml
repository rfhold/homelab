config:
  kubernetes:clusterIdentifier: pantheon
  kubernetes:context: pantheon
  storage:cluster-name: pantheon
  storage:workloadLabels:
    storage:
      app.kubernetes.io/name: rook-ceph
      app.kubernetes.io/instance: storage
      app.kubernetes.io/component: storage
      app.kubernetes.io/part-of: storage
      app.kubernetes.io/managed-by: pulumi
      rholden.dev/workload-layer: storage
  # Ceph Cluster Configuration
  storage:ceph-cluster:
    clusterName: "storage-cluster"
    monitorCount: 3
    mgrCount: 2
    allowMultipleMonPerNode: false
    monFailureDomainLabel: "kubernetes.io/hostname"
    monNodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: "node-role.kubernetes.io/control-plane"
                operator: "Exists"
    allowMultipleMgrPerNode: false
    obcAllowedAdditionalConfigFields: "maxObjects,maxSize,bucketPolicy,bucketOwner"
    resources:
      osd:
        requests:
          memory: "8Gi"
        limits:
          memory: "16Gi"
    cephConfig:
      global:
        osd_memory_target: "8589934592"
    osdTolerations:
      - key: "workload-type"
        operator: "Equal"
        value: "gpu-inference"
        effect: "NoSchedule"
    storage:
      useAllNodes: false
      useAllDevices: false
      nodes:
        - name: "apollo"
          devices:
            - name: "/dev/disk/by-id/nvme-Lexar_SSD_NM790_4TB_NME720W100638P2202"
        - name: "athena"
          devices:
            - name: "/dev/disk/by-id/nvme-Lexar_SSD_NM790_4TB_NME720W100429P2202"
        - name: "mars"
          devices:
            - name: "/dev/disk/by-id/nvme-Lexar_SSD_NM790_4TB_NME720W100597P2202"
  # Storage Class Configurations
  storage:storage-classes:
    - name: "shared-fs"
      isDefault: true
      reclaimPolicy: "Delete"
      allowVolumeExpansion: true
      volumeBindingMode: "Immediate"
      filesystem:
        metadataPool:
          name: "shared-fs-metadata"
          replication:
            size: 3
            requireSafeReplicaSize: false
          deviceClass: "nvme"
        dataPools:
          - name: "shared-fs-data"
            failureDomain: "host"
            replication:
              size: 3
              requireSafeReplicaSize: false
            deviceClass: "nvme"
        metadataServer:
          activeCount: 2
          activeStandby: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
  storage:block-storage-classes:
    - name: "database"
      reclaimPolicy: "Delete"
      allowVolumeExpansion: true
      volumeBindingMode: "WaitForFirstConsumer"
      pool:
        name: "database"
        failureDomain: "host"
        replication:
          size: 3
          requireSafeReplicaSize: true
        deviceClass: "nvme"
  # Ingress Configuration
  storage:ingress:
    enabled: true
    domain: "ceph.pantheon.holdenitdown.net"
    className: "internal"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
    tls:
      enabled: true
  # Toolbox Configuration
  storage:toolbox:
    enabled: true
  # CSI Plugin Tolerations
  storage:csi-plugin-tolerations:
    - key: "workload-type"
      operator: "Exists"
      effect: "NoSchedule"
  # CSI Provisioner Tolerations
  storage:csi-provisioner-tolerations:
    - key: "workload-type"
      operator: "Exists"
      effect: "NoSchedule"
