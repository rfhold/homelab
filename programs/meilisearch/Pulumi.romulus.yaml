config:
  meilisearch:workloadLabels:
    meilisearch:
      app.kubernetes.io/name: meilisearch
      app.kubernetes.io/instance: meilisearch
      app.kubernetes.io/component: search
      app.kubernetes.io/part-of: search
      app.kubernetes.io/managed-by: pulumi
      rholden.dev/workload-layer: application
  kubernetes:clusterIdentifier: romulus
  kubernetes:context: romulus
  meilisearch:meilisearch:
    enabled: true
    environment: "production"
    storage:
      size: "50Gi"
      storageClass: "shared-fs"
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "4Gi"
        cpu: "2000m"
    config:
      maxIndexingMemory: "2Gi"
      maxIndexingThreads: 4
      logLevel: "INFO"
    ingress:
      enabled: true
      className: "internal"
      host: "meilisearch.holdenitdown.net"
      tls:
        enabled: true
        secretName: "meilisearch-tls"
