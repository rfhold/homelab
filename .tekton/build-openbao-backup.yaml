apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: homelab-build-openbao-backup
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push, incoming]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-path-change: "[.tekton/build-openbao-backup.yaml, docker/openbao-backup/**]"
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/task: "[https://git.holdenitdown.net/rfhold/homelab/raw/branch/main/src/components/tekton-tasks/git-clone.yaml, https://git.holdenitdown.net/rfhold/homelab/raw/branch/main/src/components/tekton-tasks/buildkit-build.yaml, https://git.holdenitdown.net/rfhold/homelab/raw/branch/main/src/components/tekton-tasks/manifest-create.yaml]"
spec:
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - name: repo-url
        type: string
      - name: revision
        type: string
    workspaces:
      - name: source
    tasks:
      - name: fetch-repository
        taskRef:
          apiVersion: tekton.dev/v1
          kind: Task
          name: git-clone
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: git-auth-secret
            value: "{{ git_auth_secret }}"
        workspaces:
          - name: output
            workspace: source

      - name: build-amd64
        runAfter: [fetch-repository]
        taskRef:
          apiVersion: tekton.dev/v1
          kind: Task
          name: buildkit-build
        params:
          - name: image
            value: "{{ CONTAINER_REGISTRY }}/rfhold/openbao-backup:latest-amd64"
          - name: buildkit-addr
            value: "{{ BUILDKIT_AMD64_ADDR }}"
          - name: context
            value: docker/openbao-backup
          - name: dockerfile
            value: Dockerfile
        workspaces:
          - name: source
            workspace: source

      - name: build-arm64
        runAfter: [fetch-repository]
        taskRef:
          apiVersion: tekton.dev/v1
          kind: Task
          name: buildkit-build
        params:
          - name: image
            value: "{{ CONTAINER_REGISTRY }}/rfhold/openbao-backup:latest-arm64"
          - name: buildkit-addr
            value: "{{ BUILDKIT_ARM64_ADDR }}"
          - name: context
            value: docker/openbao-backup
          - name: dockerfile
            value: Dockerfile
        workspaces:
          - name: source
            workspace: source

      - name: manifest-create
        runAfter: [build-amd64, build-arm64]
        taskRef:
          apiVersion: tekton.dev/v1
          kind: Task
          name: manifest-create
        params:
          - name: base-image
            value: "{{ CONTAINER_REGISTRY }}/rfhold/openbao-backup"
          - name: tag
            value: latest
          - name: push-latest
            value: "true"

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
