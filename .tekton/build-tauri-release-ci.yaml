apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: homelab-build-tauri-release-ci
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push, incoming]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/on-path-change: "[.tekton/build-tauri-release-ci.yaml, docker/tauri-release-ci/**]"
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/task: "[https://git.holdenitdown.net/rfhold/homelab/raw/branch/main/src/components/tekton-tasks/git-clone.yaml, https://git.holdenitdown.net/rfhold/homelab/raw/branch/main/src/components/tekton-tasks/buildkit-build.yaml]"
spec:
  params:
    - name: repo-url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  pipelineSpec:
    params:
      - name: repo-url
        type: string
      - name: revision
        type: string
    workspaces:
      - name: source
    tasks:
      - name: fetch-repository
        taskRef:
          apiVersion: tekton.dev/v1
          kind: Task
          name: git-clone
        params:
          - name: repo-url
            value: $(params.repo-url)
          - name: revision
            value: $(params.revision)
          - name: git-auth-secret
            value: "{{ git_auth_secret }}"
        workspaces:
          - name: output
            workspace: source

      - name: build
        runAfter: [fetch-repository]
        taskRef:
          apiVersion: tekton.dev/v1
          kind: Task
          name: buildkit-build
        params:
          - name: image
            value: "{{ CONTAINER_REGISTRY }}/rfhold/tauri-release-ci:rust1.96.0-tauri2.10.1-pnpm11.5.0-android36"
          - name: buildkit-addr
            value: "{{ BUILDKIT_AMD64_ADDR }}"
          - name: context
            value: docker/tauri-release-ci
          - name: dockerfile
            value: Dockerfile
        workspaces:
          - name: source
            workspace: source
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
