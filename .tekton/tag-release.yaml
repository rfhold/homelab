apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: homelab-tag-release
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/tags/v*]"
    pipelinesascode.tekton.dev/max-keep-runs: "2"
spec:
  pipelineSpec:
    workspaces:
      - name: source
    params:
      - name: tag
        type: string
        default: "{{ source_branch }}"
    tasks:
      - name: valid-root-semver-tag
        taskSpec:
          params:
            - name: tag
              type: string
          results:
            - name: tag
            - name: valid
          steps:
            - name: validate
              image: docker.io/library/alpine:3.21
              script: |
                #!/bin/sh
                TAG=$(echo "$(params.tag)" | sed 's|refs/tags/||')
                if echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                  echo "Valid root semver release tag: $TAG"
                  echo -n "$TAG" > $(results.tag.path)
                  echo -n "true" > $(results.valid.path)
                else
                  echo "Skipping release work: $TAG is not a valid root semver release tag"
                  echo -n "invalid-root-semver-tag" > $(results.tag.path)
                  echo -n "false" > $(results.valid.path)
                fi
        params:
          - name: tag
            value: $(params.tag)

      - name: fetch-repo
        runAfter: [valid-root-semver-tag]
        when:
          - input: $(tasks.valid-root-semver-tag.results.valid)
            operator: in
            values: ["true"]
        taskSpec:
          workspaces:
            - name: output
          params:
            - name: tag
              type: string
          steps:
            - name: clone
              image: alpine/git:latest
              workingDir: $(workspaces.output.path)
              script: |
                #!/bin/sh
                set -e
                git clone --depth 1 --branch $(params.tag) {{ repo_url }} .
        params:
          - name: tag
            value: $(tasks.valid-root-semver-tag.results.tag)
        workspaces:
          - name: output
            workspace: source

      - name: release-info
        runAfter: [fetch-repo]
        when:
          - input: $(tasks.valid-root-semver-tag.results.valid)
            operator: in
            values: ["true"]
        taskSpec:
          workspaces:
            - name: source
          params:
            - name: tag
              type: string
          steps:
            - name: show-info
              image: docker.io/library/alpine:3.21
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                echo "Release Tag: $(params.tag)"
                echo "Commit: {{ revision }}"
                echo "Repository: {{ repo_url }}"
        params:
          - name: tag
            value: $(tasks.valid-root-semver-tag.results.tag)
        workspaces:
          - name: source
            workspace: source

  params:
    - name: tag
      value: "{{ source_branch }}"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
