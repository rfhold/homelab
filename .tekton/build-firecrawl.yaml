apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: build-firecrawl
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[refs/tags/firecrawl-v*]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
spec:
  params:
    - name: version
      value: "{{ source_branch }}"
  pipelineSpec:
    params:
      - name: version
        type: string
    workspaces:
      - name: source
    tasks:
      - name: clone-firecrawl
        taskSpec:
          params:
            - name: version
              type: string
          results:
            - name: semver
              description: Clean semver extracted from the tag (e.g. v2.8.0)
          workspaces:
            - name: output
          steps:
            - name: clone
              image: alpine/git:latest
              workingDir: $(workspaces.output.path)
              script: |
                #!/bin/sh
                set -e
                SEMVER=$(echo $(params.version) | sed 's|refs/tags/firecrawl-||')
                echo -n "$SEMVER" > $(results.semver.path)
                git clone https://github.com/mendableai/firecrawl.git .
                git checkout $SEMVER
        params:
          - name: version
            value: $(params.version)
        workspaces:
          - name: output
            workspace: source

      - name: build-amd64
        runAfter: [clone-firecrawl]
        taskRef:
          apiVersion: tekton.dev/v1
          kind: Task
          name: buildkit-build
        params:
          - name: image
            value: "{{ params.CONTAINER_REGISTRY }}/rfhold/firecrawl:$(tasks.clone-firecrawl.results.semver)-amd64"
          - name: buildkit-addr
            value: "{{ params.BUILDKIT_AMD64_ADDR }}"
          - name: context
            value: apps/api
          - name: dockerfile
            value: Dockerfile
        workspaces:
          - name: source
            workspace: source

      - name: build-arm64
        runAfter: [clone-firecrawl]
        taskRef:
          apiVersion: tekton.dev/v1
          kind: Task
          name: buildkit-build
        params:
          - name: image
            value: "{{ params.CONTAINER_REGISTRY }}/rfhold/firecrawl:$(tasks.clone-firecrawl.results.semver)-arm64"
          - name: buildkit-addr
            value: "{{ params.BUILDKIT_ARM64_ADDR }}"
          - name: context
            value: apps/api
          - name: dockerfile
            value: Dockerfile
        workspaces:
          - name: source
            workspace: source

      - name: create-manifest
        runAfter: [build-amd64, build-arm64]
        taskRef:
          apiVersion: tekton.dev/v1
          kind: Task
          name: manifest-create
        params:
          - name: base-image
            value: "{{ params.CONTAINER_REGISTRY }}/rfhold/firecrawl"
          - name: tag
            value: $(tasks.clone-firecrawl.results.semver)
          - name: push-latest
            value: "false"

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 4Gi
